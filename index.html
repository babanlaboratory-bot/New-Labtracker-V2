                                                    Total Parameters: {selectedTestsBasket.reduce((s, t) => s + t.parameters, 0)}
                                                </span>
                                            )}
                                        </div>
                                        {selectedTestsBasket.length === 0 ? (
                                            <p className="text-xs text-slate-400 italic font-medium">Bundle is blank. Add diagnostic profiles from the selector above.</p>
                                        ) : (
                                            <div className="flex flex-wrap gap-1.5">
                                                {selectedTestsBasket.map((test, idx) => (
                                                    <span key={idx} className={`inline-flex items-center gap-1.5 text-xs font-bold px-2.5 py-1 rounded border ${test.type === 'Outhouse' ? 'bg-amber-50 text-amber-800 border-amber-200' : 'bg-teal-50 text-teal-800 border-teal-200'}`}>
                                                        {test.name}
                                                        <button type="button" onClick={() => removeTestFromBasket(idx)} className="text-slate-400 hover:text-slate-900 font-bold ml-1 text-sm">
                                                            &times;
                                                        </button>
                                                    </span>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">Remarks / Operational Logs</label>
                                        <input
                                            type="text"
                                            placeholder="Add operational notes here..."
                                            value={notes}
                                            onChange={(e) => setNotes(e.target.value)}
                                            className="w-full p-2.5 border border-slate-300 rounded-lg text-xs font-medium"
                                        />
                                    </div>

                                    <button
                                        type="submit"
                                        className={`w-full text-white font-bold py-2.5 px-4 rounded-lg transition text-xs shadow-md mt-2 ${editingRecordId ? 'bg-amber-600 hover:bg-amber-700' : 'bg-teal-700 hover:bg-teal-800'}`}
                                    >
                                        {editingRecordId ? 'Apply & Save System Changes' : `Commit Entry Row Line${parseInt(patientCount) > 1 ? `s (${patientCount}x)` : ''}`}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ===================================================================== */}
                    {/* PAGE 4: ACTIVE DATABASE SESSION LOGS                                  */}
                    {/* ===================================================================== */}
                    {activePage === 'logs' && (
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col">
                            <div className="flex flex-wrap justify-between items-center mb-4 border-b pb-3 gap-2">
                                <div>
                                    <h2 className="text-lg font-black text-slate-800">🗄️ Active Database Session Logs ({formatMonthDisplay(selectedMonth)})</h2>
                                    <p className="text-xs text-slate-400 font-medium">Displaying all {filteredEntries.length} patient records and complete test bundles for {formatMonthDisplay(selectedMonth)}.</p>
                                </div>
                                <button onClick={() => setActivePage('entry')} className="bg-teal-700 hover:bg-teal-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">
                                    + New Patient Entry
                                </button>
                            </div>
                            
                            <div className="overflow-x-auto flex-1">
                                {filteredEntries.length === 0 ? (
                                    <div className="text-center py-20 text-slate-400 text-xs font-medium">
                                        No records logged inside {formatMonthDisplay(selectedMonth)}. Switch the View Window in the top bar to inspect other months.
                                    </div>
                                ) : (
                                    <table className="w-full text-left border-collapse text-xs">
                                        <thead>
                                            <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase tracking-wider text-[10px] font-black">
                                                <th className="p-3">Timestamp / Notes</th>
                                                <th className="p-3">Dept</th>
                                                <th className="p-3">Patient</th>
                                                <th className="p-3">All Entered Tests (Complete Bundle)</th>
                                                <th className="p-3 text-right">Params</th>
                                                <th className="p-3 text-center">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 font-medium text-slate-700">
                                            {filteredEntries.map((entry) => {
                                                const allTestsForPatient = getEntryBasketItems(entry);
                                                return (
                                                    <tr key={entry.id} className={`hover:bg-slate-50/80 transition align-top ${editingRecordId === entry.id ? 'bg-amber-50/50' : ''}`}>
                                                        <td className="p-3 whitespace-nowrap">
                                                            <span className="font-bold text-slate-800 block">{entry.date}</span>
                                                            <span className="text-[10px] text-slate-400 block max-w-[150px] whitespace-normal">{entry.time} • {entry.notes}</span>
                                                        </td>
                                                        <td className="p-3 whitespace-nowrap">
                                                            <span className={`px-2 py-0.5 rounded text-[10px] font-black ${entry.patientType === 'OPD' ? 'bg-teal-50 text-teal-700 border border-teal-200' : 'bg-indigo-50 text-indigo-700 border border-indigo-200'}`}>
                                                                {entry.patientType}
                                                            </span>
                                                        </td>
                                                        <td className="p-3 whitespace-nowrap">
                                                            <span className="font-bold block">{entry.age} {entry.ageUnit || 'Yrs'}</span>
                                                            <span className="text-[10px] text-slate-400 block">{entry.sex}</span>
                                                        </td>
                                                        <td className="p-3">
                                                            <div className="flex flex-wrap gap-1.5">
                                                                {allTestsForPatient.length > 0 ? allTestsForPatient.map((b, i) => (
                                                                    <span
                                                                        key={i}
                                                                        className={`inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded border ${
                                                                            b.type === 'Outhouse'
                                                                                ? 'bg-amber-50 text-amber-900 border-amber-200'
                                                                                : 'bg-slate-100 text-slate-800 border-slate-200'
                                                                        }`}
                                                                    >
                                                                        <span>{b.name}</span>
                                                                        <span className="text-[9px] font-black opacity-60">[{b.type === 'Outhouse' ? 'OH' : 'IH'}]</span>
                                                                    </span>
                                                                )) : (
                                                                    <span className="text-slate-600 font-semibold">{entry.testName}</span>
                                                                )}
                                                            </div>
                                                            <span className="text-[10px] text-slate-400 font-bold block mt-1.5">
                                                                Total: {allTestsForPatient.length || entry.totalTests || 1} test(s) entered
                                                            </span>
                                                        </td>
                                                        <td className="p-3 text-right font-mono font-bold text-purple-700 text-xs whitespace-nowrap">{entry.totalParameters}</td>
                                                        <td className="p-3 text-center space-x-2 whitespace-nowrap">
                                                            <button onClick={() => startEditing(entry)} className="text-[11px] font-bold text-teal-600 hover:text-teal-900 bg-teal-50 px-2 py-1 rounded transition">
                                                                Modify
                                                            </button>
                                                            <button onClick={() => deleteEntry(entry.id)} className="text-[11px] font-bold text-rose-600 hover:text-rose-900 bg-rose-50 px-2 py-1 rounded transition">
                                                                Drop
                                                            </button>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Date-Wise Test Performance Breakdown Modal */}
                    {testDateModal.show && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-xl overflow-hidden max-h-[85vh] flex flex-col border border-slate-200">
                                <header className="bg-teal-800 text-white p-4 border-b border-teal-700 flex justify-between items-center">
                                    <div>
                                        <h3 className="text-sm font-black uppercase tracking-wide">Date-Wise Test Activity</h3>
                                        <p className="text-[11px] text-teal-200 font-medium">{testDateModal.testName} ({formatMonthDisplay(selectedMonth)})</p>
                                    </div>
                                    <button onClick={() => setTestDateModal({ ...testDateModal, show: false })} className="text-teal-200 hover:text-white font-bold text-2xl leading-none">&times;</button>
                                </header>
                                
                                <div className="p-4 overflow-y-auto flex-1">
                                    {testDateModal.dateWiseData.length === 0 ? (
                                        <p className="text-center text-xs text-slate-400 py-8">No tests performed for <strong>{testDateModal.testName}</strong> during {formatMonthDisplay(selectedMonth)}.</p>
                                    ) : (
                                        <table className="w-full text-left text-xs border-collapse">
                                            <thead>
                                                <tr className="bg-slate-100 text-slate-600 uppercase text-[9px] font-black tracking-wider border-b border-slate-200">
                                                    <th className="p-2.5">Date</th>
                                                    <th className="p-2.5 text-center bg-teal-50/50 text-teal-800">OPD Count</th>
                                                    <th className="p-2.5 text-center bg-indigo-50/50 text-indigo-800">IPD Count</th>
                                                    <th className="p-2.5 text-center">Total Tests</th>
                                                    <th className="p-2.5 text-right">Total Parameters</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 font-medium">
                                                {testDateModal.dateWiseData.map((row, idx) => (
                                                    <tr key={idx} className="hover:bg-slate-50">
                                                        <td className="p-2.5 font-bold text-slate-800">{row.date}</td>
                                                        <td className="p-2.5 text-center bg-teal-50/20 text-teal-700 font-bold">{row.opdCount}</td>
                                                        <td className="p-2.5 text-center bg-indigo-50/20 text-indigo-700 font-bold">{row.ipdCount}</td>
                                                        <td className="p-2.5 text-center font-bold text-slate-800">{row.totalCount}</td>
                                                        <td className="p-2.5 text-right font-mono font-black text-purple-700">{row.totalParams}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                            <tfoot>
                                                <tr className="bg-slate-100 text-slate-800 font-black text-xs border-t-2 border-slate-300">
                                                    <td className="p-2.5">Total Cumulative</td>
                                                    <td className="p-2.5 text-center text-teal-800">{testDateModal.dateWiseData.reduce((s, r) => s + r.opdCount, 0)}</td>
                                                    <td className="p-2.5 text-center text-indigo-800">{testDateModal.dateWiseData.reduce((s, r) => s + r.ipdCount, 0)}</td>
                                                    <td className="p-2.5 text-center text-slate-900">{testDateModal.dateWiseData.reduce((s, r) => s + r.totalCount, 0)}</td>
                                                    <td className="p-2.5 text-right font-mono text-purple-800">{testDateModal.dateWiseData.reduce((s, r) => s + r.totalParams, 0)}</td>
                                                </tr>
                                            </tfoot>
                                        </table>
                                    )}
                                </div>

                                <footer className="bg-slate-50 p-3 border-t border-slate-200 text-right">
                                    <button onClick={() => setTestDateModal({ ...testDateModal, show: false })} className="bg-slate-700 hover:bg-slate-800 text-white font-bold py-1.5 px-4 rounded text-xs transition">
                                        Close Window
                                    </button>
                                </footer>
                            </div>
                        </div>
                    )}

                    {/* Scorecard Parameters Breakdown Modal */}
                    {detailModal.show && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden max-h-[85vh] flex flex-col border border-slate-200">
                                <header className="bg-slate-800 text-white p-4 border-b border-slate-700 flex justify-between items-center">
                                    <div>
                                        <h3 className="text-sm font-black uppercase tracking-wide">{detailModal.title}</h3>
                                        <p className="text-[11px] text-slate-300 font-medium">{detailModal.subtitle}</p>
                                    </div>
                                    <button onClick={() => setDetailModal({ ...detailModal, show: false })} className="text-slate-300 hover:text-white font-bold text-2xl leading-none">&times;</button>
                                </header>
                                
                                <div className="p-4 overflow-y-auto flex-1">
                                    {detailModal.data.length === 0 ? (
                                        <p className="text-center text-xs text-slate-400 py-8">No test parameter details matching this card filter for the selected month.</p>
                                    ) : (
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-xs border-collapse">
                                                <thead>
                                                    <tr className="bg-slate-100 text-slate-600 uppercase text-[9px] font-black tracking-wider border-b border-slate-200">
                                                        <th className="p-2.5">Test Profile Name</th>
                                                        <th className="p-2.5 text-center">Params / Test</th>
                                                        <th className="p-2.5 bg-teal-50/50 text-teal-800 text-center">OPD Tests</th>
                                                        <th className="p-2.5 bg-teal-50/80 text-teal-900 text-center">OPD Params</th>
                                                        <th className="p-2.5 bg-indigo-50/50 text-indigo-800 text-center">IPD Tests</th>
                                                        <th className="p-2.5 bg-indigo-50/80 text-indigo-900 text-center">IPD Params</th>
                                                        <th className="p-2.5 text-right">Total Params</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 font-medium">
                                                    {detailModal.data.map((item, idx) => (
                                                        <tr key={idx} className="hover:bg-slate-50">
                                                            <td className="p-2.5 font-bold text-slate-800">
                                                                {item.name}
                                                                <span className={`ml-2 text-[8px] px-1 py-0.2 rounded font-black ${item.type === 'Outhouse' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>
                                                                    {item.type === 'Outhouse' ? 'OH' : 'IH'}
                                                                </span>
                                                            </td>
                                                            <td className="p-2.5 text-center font-mono text-slate-500">{item.perTestParams}</td>
                                                            <td className="p-2.5 text-center bg-teal-50/30 text-teal-700 font-bold">{item.opdTests}</td>
                                                            <td className="p-2.5 text-center bg-teal-50/60 text-teal-800 font-black">{item.opdParams}</td>
                                                            <td className="p-2.5 text-center bg-indigo-50/30 text-indigo-700 font-bold">{item.ipdTests}</td>
                                                            <td className="p-2.5 text-center bg-indigo-50/60 text-indigo-800 font-black">{item.ipdParams}</td>
                                                            <td className="p-2.5 text-right font-mono font-black text-purple-700">{item.opdParams + item.ipdParams}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                                <tfoot>
                                                    <tr className="bg-slate-100 text-slate-800 font-black text-xs border-t-2 border-slate-300">
                                                        <td className="p-2.5">Total Summary</td>
                                                        <td className="p-2.5 text-center">-</td>
                                                        <td className="p-2.5 text-center text-teal-700">{detailModal.data.reduce((sum, i) => sum + i.opdTests, 0)}</td>
                                                        <td className="p-2.5 text-center text-teal-800">{detailModal.data.reduce((sum, i) => sum + i.opdParams, 0)}</td>
                                                        <td className="p-2.5 text-center text-indigo-700">{detailModal.data.reduce((sum, i) => sum + i.ipdTests, 0)}</td>
                                                        <td className="p-2.5 text-center text-indigo-800">{detailModal.data.reduce((sum, i) => sum + i.ipdParams, 0)}</td>
                                                        <td className="p-2.5 text-right font-mono text-purple-800">
                                                            {detailModal.data.reduce((sum, i) => sum + i.opdParams + i.ipdParams, 0)}
                                                        </td>
                                                    </tr>
                                                </tfoot>
                                            </table>
                                        </div>
                                    )}
                                </div>

                                <footer className="bg-slate-50 p-3 border-t border-slate-200 text-right">
                                    <button onClick={() => setDetailModal({ ...detailModal, show: false })} className="bg-slate-700 hover:bg-slate-800 text-white font-bold py-1.5 px-4 rounded text-xs transition">
                                        Close Breakdown
                                    </button>
                                </footer>
                            </div>
                        </div>
                    )}

                    {/* Setup Test Library Configuration Modal */}
                    {showTestModal && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden max-h-[90vh] flex flex-col border border-slate-200">
                                <header className="bg-slate-50 p-4 border-b border-slate-100 flex justify-between items-center">
                                    <h3 className="text-sm font-black text-slate-700 uppercase tracking-wide">Test Library Manager Setup</h3>
                                    <button onClick={() => setShowTestModal(false)} className="text-slate-400 hover:text-slate-600 font-bold text-xl leading-none">&times;</button>
                                </header>
                                
                                <div className="p-4 overflow-y-auto flex-1 space-y-4">
                                    <form onSubmit={handleAddTestToDirectory} className="bg-slate-50 p-3.5 rounded-lg border border-slate-200 space-y-3">
                                        <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Add New Diagnostic Mapping Definition</p>
                                        <div>
                                            <label className="block text-[11px] font-bold text-slate-600 mb-1">Test Label Title</label>
                                            <input 
                                                type="text" 
                                                placeholder="e.g., Uric Acid Panel" 
                                                value={newTestName}
                                                onChange={(e) => setNewTestName(e.target.value)}
                                                className="w-full p-2 border border-slate-300 rounded text-xs bg-white font-medium"
                                            />
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="block text-[11px] font-bold text-slate-600 mb-1">Weight Params</label>
                                                <input 
                                                    type="number" 
                                                    min="1"
                                                    placeholder="Count" 
                                                    value={newTestParams}
                                                    onChange={(e) => setNewTestParams(e.target.value)}
                                                    className="w-full p-2 border border-slate-300 rounded text-xs bg-white font-semibold"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-bold text-slate-600 mb-1">Processing Routing</label>
                                                <select
                                                    value={newTestType}
                                                    onChange={(e) => setNewTestType(e.target.value)}
                                                    className="w-full p-2 border border-slate-300 rounded text-xs bg-white font-bold text-slate-700"
                                                >
                                                    <option value="Inhouse">Inhouse (IH)</option>
                                                    <option value="Outhouse">Outhouse (OH)</option>
                                                </select>
                                            </div>
                                        </div>
                                        <button type="submit" className="w-full bg-slate-700 hover:bg-slate-800 text-white font-bold py-1.5 rounded text-xs transition tracking-wide">
                                            Inject Definition Into System Menu
                                        </button>
                                    </form>

                                    <div className="space-y-2">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Active Catalog Definitions</p>
                                        <div className="divide-y divide-slate-100 max-h-[180px] overflow-y-auto border border-slate-200 rounded-lg bg-white">
                                            {testDirectory.map((test, idx) => (
                                                <div key={idx} className="p-2 flex justify-between items-center text-xs hover:bg-slate-50/60 font-medium">
                                                    <div>
                                                        <p className="font-bold text-slate-800">{test.name}</p>
                                                        <p className="text-[10px] text-slate-400 font-semibold">{test.parameters} Parameters • <span className={test.type === 'Outhouse' ? 'text-amber-600' : 'text-emerald-600'}>{test.type || 'Inhouse'}</span></p>
                                                    </div>
                                                    <button type="button" onClick={() => deleteTestFromDirectory(idx)} className="text-[10px] font-bold text-rose-500 hover:underline">
                                                        Drop
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <footer className="bg-slate-50 p-2.5 border-t border-slate-100 text-right">
                                    <button onClick={() => setShowTestModal(false)} className="bg-slate-300 hover:bg-slate-400 text-slate-700 font-bold py-1 px-4 rounded text-xs transition">
                                        Close Panel
                                    </button>
                                </footer>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LabTracker />);
    </script>
</body>
</html>
