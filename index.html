<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Laboratory Statistics Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Supabase Client Connection Setup ---
        const SUPABASE_URL = 'https://kilprsosrakeyhnhgtaf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpbHByc29zcmFrZXlobmhndGFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NDU4ODEsImV4cCI6MjEwNjQyMTg4MX0._znMFqmjVn6JPmVzKmcMb5iFs_Fnt91wLoWCzk4c7Xw';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function LabTracker() {
            // --- Navigation Page State ---
            const [activePage, setActivePage] = useState('entry'); // 'entry', 'snapshot', 'catalog', 'logs'

            // --- Main Application States ---
            const [entries, setEntries] = useState([]);
            const [testDirectory, setTestDirectory] = useState([]);
            const [editingRecordId, setEditingRecordId] = useState(null);
            const [isLoading, setIsLoading] = useState(true);

            // Modal States
            const [detailModal, setDetailModal] = useState({ show: false, title: '', subtitle: '', data: [] });
            const [testDateModal, setTestDateModal] = useState({ show: false, testName: '', dateWiseData: [] });

            const defaultTestDirectory = [
                { name: 'Glucose (Random/Fasting)', parameters: 1, type: 'Inhouse' },
                { name: 'Electrolytes (Na/K/Cl)', parameters: 3, type: 'Inhouse' },
                { name: 'Liver Function Test (LFT)', parameters: 9, type: 'Inhouse' },
                { name: 'Lipid Profile', parameters: 5, type: 'Outhouse' },
                { name: 'Complete Blood Count (CBC)', parameters: 18, type: 'Inhouse' }
            ];

            // Helper to get current date formatted as DD/MM/YY
            const getTodayDDMMYY = () => {
                const today = new Date();
                const day = String(today.getDate()).padStart(2, '0');
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const year = String(today.getFullYear()).slice(-2);
                return `${day}/${month}/${year}`;
            };

            const getCurrentMonthString = () => {
                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                return `${year}-${month}`; // YYYY-MM structure
            };

            const [patientType, setPatientType] = useState('OPD');
            const [patientAge, setPatientAge] = useState('');
            const [patientAgeUnit, setPatientAgeUnit] = useState('Years');
            const [patientSex, setPatientSex] = useState('Male');
            const [patientCount, setPatientCount] = useState('1');
            const [selectedTestIndex, setSelectedTestIndex] = useState('0');
            const [selectedTestsBasket, setSelectedTestsBasket] = useState([]);
            const [notes, setNotes] = useState('');
            
            // Format set to DD/MM/YY
            const [customDate, setCustomDate] = useState(getTodayDDMMYY());
            const [selectedMonth, setSelectedMonth] = useState(getCurrentMonthString());

            const [newTestName, setNewTestName] = useState('');
            const [newTestParams, setNewTestParams] = useState('');
            const [newTestType, setNewTestType] = useState('Inhouse');
            const [showTestModal, setShowTestModal] = useState(false);

            useEffect(() => {
                fetchInitialData();
            }, []);

            // Helper to parse any date format cleanly into { day, month, year4 }
            const parseDateParts = (dateStr) => {
                if (!dateStr) return null;
                const clean = String(dateStr).trim();
                if (clean.includes('/')) {
                    const parts = clean.split('/');
                    if (parts.length === 3) {
                        const d = parts[0].padStart(2, '0');
                        const m = parts[1].padStart(2, '0');
                        let y = parts[2].trim();
                        if (y.length === 2) y = `20${y}`;
                        return { day: d, month: m, year: y, full: `${d}/${m}/${y}`, monthKey: `${y}-${m}` };
                    }
                }
                if (clean.includes('-')) {
                    const parts = clean.split('T')[0].split('-');
                    if (parts.length === 3 && parts[0].length === 4) {
                        const y = parts[0];
                        const m = parts[1].padStart(2, '0');
                        const d = parts[2].padStart(2, '0');
                        return { day: d, month: m, year: y, full: `${d}/${m}/${y}`, monthKey: `${y}-${m}` };
                    }
                }
                return null;
            };

            const handleCustomDateChange = (val) => {
                setCustomDate(val);
                const parsed = parseDateParts(val);
                if (parsed && parsed.month.length === 2 && parsed.year.length === 4 && !isNaN(parsed.month) && !isNaN(parsed.year)) {
                    const mNum = parseInt(parsed.month, 10);
                    if (mNum >= 1 && mNum <= 12) {
                        setSelectedMonth(parsed.monthKey);
                    }
                }
            };

            const normalizeToFullDate = (dateStr) => {
                const parsed = parseDateParts(dateStr);
                if (parsed) return parsed.full;
                return new Date().toLocaleDateString('en-IN');
            };

            // Paginated fetch so older months beyond 1,000 rows are never cut off
            const fetchAllLabEntries = async () => {
                let allRecords = [];
                let page = 0;
                const pageSize = 1000;
                let hasMore = true;

                while (hasMore) {
                    const from = page * pageSize;
                    const to = from + pageSize - 1;
                    const { data, error } = await supabase
                        .from('lab_entries')
                        .select('*')
                        .order('created_at', { ascending: false })
                        .range(from, to);

                    if (error) throw error;

                    if (data && data.length > 0) {
                        allRecords = allRecords.concat(data);
                        if (data.length < pageSize) {
                            hasMore = false;
                        } else {
                            page += 1;
                        }
                    } else {
                        hasMore = false;
                    }
                }
                return allRecords;
            };

            const fetchInitialData = async () => {
                setIsLoading(true);
                try {
                    const logData = await fetchAllLabEntries();
                    setEntries(logData || []);

                    let { data: testData, error: testError } = await supabase
                        .from('test_directory')
                        .select('*')
                        .order('id', { ascending: true });

                    if (testError) throw testError;

                    if (!testData || testData.length === 0) {
                        const seedPayload = defaultTestDirectory.map(t => ({
                            name: t.name,
                            parameters: t.parameters,
                            type: t.type
                        }));

                        const { data: seededData, error: seedError } = await supabase
                            .from('test_directory')
                            .insert(seedPayload)
                            .select('*');
                        
                        if (seedError) throw seedError;
                        testData = seededData;
                    }

                    if (testData) {
                        setTestDirectory(testData.map(t => ({
                            ...t,
                            type: t.type || 'Inhouse'
                        })));
                    }

                } catch (err) {
                    console.error("Database connection runtime error:", err.message);
                } finally {
                    setIsLoading(false);
                }
            };

            const addTestToBasket = () => {
                const testObj = testDirectory[parseInt(selectedTestIndex)];
                if (!testObj) return;

                if (selectedTestsBasket.some(t => t.name === testObj.name)) {
                    alert("This test is already included in the current patient bundle.");
                    return;
                }
                setSelectedTestsBasket([...selectedTestsBasket, testObj]);
            };

            const removeTestFromBasket = (indexToRemove) => {
                setSelectedTestsBasket(selectedTestsBasket.filter((_, idx) => idx !== indexToRemove));
            };

            const handleAddTestToDirectory = async (e) => {
                e.preventDefault();
                const name = newTestName.trim();
                const params = parseInt(newTestParams) || 0;

                if (!name || params <= 0) {
                    alert("Please enter a valid test name and parameter count greater than 0.");
                    return;
                }

                if (testDirectory.some(t => t.name.toLowerCase() === name.toLowerCase())) {
                    alert("A test with this name already exists!");
                    return;
                }

                try {
                    const { data, error } = await supabase
                        .from('test_directory')
                        .insert([{ name, parameters: params, type: newTestType }])
                        .select('*');

                    if (error) throw error;
                    
                    setTestDirectory([...testDirectory, data[0]]);
                    setNewTestName('');
                    setNewTestParams('');
                    setNewTestType('Inhouse');
                } catch (err) {
                    alert("Error saving test profile: " + err.message);
                }
            };

            const getEntryBasketItems = (entry) => {
                let rawItems = [];
                if (Array.isArray(entry.basketItems) && entry.basketItems.length > 0) {
                    rawItems = entry.basketItems;
                } else if (typeof entry.basketItems === 'string' && entry.basketItems.trim().startsWith('[')) {
                    try {
                        const parsed = JSON.parse(entry.basketItems);
                        if (Array.isArray(parsed)) rawItems = parsed;
                    } catch (e) {}
                }

                if (rawItems.length > 0) {
                    return rawItems.map(item => {
                        const name = (item.name || '').trim();
                        const matched = testDirectory.find(t => t.name.trim().toLowerCase() === name.toLowerCase());
                        return {
                            name,
                            parameters: item.parameters || (matched ? matched.parameters : 1),
                            type: item.type || (matched ? matched.type : 'Inhouse')
                        };
                    }).filter(i => i.name);
                }

                if (entry.testName) {
                    return entry.testName.split(' + ').map(rawName => {
                        const name = rawName.trim();
                        const matched = testDirectory.find(t => t.name.trim().toLowerCase() === name.toLowerCase());
                        return {
                            name,
                            parameters: matched ? matched.parameters : 1,
                            type: matched ? matched.type : 'Inhouse'
                        };
                    }).filter(i => i.name);
                }

                return [];
            };

            const startEditing = (entry) => {
                setEditingRecordId(entry.id);
                setPatientType(entry.patientType);
                if (typeof entry.age === 'string') {
                    const parts = entry.age.split(' ');
                    if (parts.length === 2 && ['Days', 'Months', 'Years'].includes(parts[1])) {
                        setPatientAge(parts[0]);
                        setPatientAgeUnit(parts[1]);
                    } else {
                        setPatientAge(entry.age);
                        setPatientAgeUnit(entry.ageUnit || 'Years');
                    }
                } else {
                    setPatientAge(entry.age);
                    setPatientAgeUnit(entry.ageUnit || 'Years');
                }
                setPatientSex(entry.sex);
                setPatientCount('1');
                setNotes(entry.notes === 'N/A' ? '' : entry.notes);
                
                const parsed = parseDateParts(entry.date);
                if (parsed) {
                    const shortYear = parsed.year.slice(-2);
                    setCustomDate(`${parsed.day}/${parsed.month}/${shortYear}`);
                }

                setSelectedTestsBasket(getEntryBasketItems(entry));
                setActivePage('entry');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const cancelEditing = () => {
                setEditingRecordId(null);
                setPatientAge('');
                setPatientAgeUnit('Years');
                setPatientCount('1');
                setNotes('');
                setSelectedTestsBasket([]);
                setCustomDate(getTodayDDMMYY());
            };

            const handleSubmitEntry = async (e) => {
                e.preventDefault();
                const age = parseInt(patientAge) || 0;
                const count = parseInt(patientCount) || 1;

                if (age <= 0) return alert("Please enter a valid patient age.");
                if (selectedTestsBasket.length === 0) return alert("Please add at least one test to the bundle.");

                const dateRegex = /^\d{2}\/\d{2}\/\d{2}$/;
                if (!dateRegex.test(customDate)) {
                    return alert("Please enter a valid date in dd/mm/yy format (e.g. 29/09/26).");
                }

                const cumulativeParamsEach = selectedTestsBasket.reduce((sum, t) => sum + t.parameters, 0);
                const combinedTestNames = selectedTestsBasket.map(t => t.name).join(' + ');
                const totalTests = selectedTestsBasket.length; 
                const totalParameters = cumulativeParamsEach;
                const finalFormattedDate = normalizeToFullDate(customDate);

                if (editingRecordId) {
                    const updatedPayload = {
                        date: finalFormattedDate,
                        patientType,
                        age,
                        ageUnit: patientAgeUnit,
                        sex: patientSex,
                        testName: combinedTestNames,
                        basketItems: selectedTestsBasket.map(t => ({ name: t.name, parameters: t.parameters, type: t.type || 'Inhouse' })),
                        parametersPerTest: cumulativeParamsEach,
                        totalTests,
                        totalParameters,
                        notes: notes.trim() || 'N/A'
                    };

                    try {
                        const { data, error } = await supabase
                            .from('lab_entries')
                            .update(updatedPayload)
                            .eq('id', editingRecordId)
                            .select();

                        if (error) throw error;
                        setEntries(prev => prev.map(item => item.id === editingRecordId ? data[0] : item));
                        cancelEditing();
                        alert("Record updated successfully!");
                    } catch (err) {
                        alert("Error modifying record line: " + err.message);
                    }
                } else {
                    const newEntriesBatch = [];
                    const currentTimeString = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

                    for (let i = 0; i < count; i++) {
                        newEntriesBatch.push({
                            date: finalFormattedDate,
                            time: currentTimeString,
                            patientType,
                            age,
                            ageUnit: patientAgeUnit,
                            sex: patientSex,
                            testName: combinedTestNames,
                            basketItems: selectedTestsBasket.map(t => ({ name: t.name, parameters: t.parameters, type: t.type || 'Inhouse' })),
                            parametersPerTest: cumulativeParamsEach,
                            totalTests,
                            totalParameters,
                            notes: notes.trim() || 'N/A'
                        });
                    }

                    try {
                        const { data, error } = await supabase
                            .from('lab_entries')
                            .insert(newEntriesBatch)
                            .select();

                        if (error) throw error;
                        setEntries(prev => [...data, ...prev]);
                        setPatientAge('');
                        setPatientAgeUnit('Years');
                        setPatientCount('1');
                        setNotes('');
                        setSelectedTestsBasket([]);
                    } catch (err) {
                        alert("Error saving record: " + err.message);
                    }
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    const text = event.target.result;
                    const lines = text.split(/\r?\n/);
                    const parsedRecords = [];
                    const currentTimeString = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
                    const csvSplitRegex = new RegExp(',(?=(?:(?:[^"]*"){2})*[^"]*$)');

                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;
                        
                        const columns = line.split(csvSplitRegex);
                        if (columns.length < 5) continue;

                        const rawFileDate = columns[0].replace(/"/g, '').trim() || new Date().toLocaleDateString('en-IN');
                        const fileDate = normalizeToFullDate(rawFileDate);
                        const fileDept = columns[1].replace(/"/g, '').trim() || 'OPD';
                        const fileAgeRaw = columns[2].replace(/"/g, '').trim() || '30 Years';
                        let fileAge = parseInt(fileAgeRaw) || 30;
                        let fileAgeUnit = 'Years';
                        if (fileAgeRaw.includes('Days')) fileAgeUnit = 'Days';
                        else if (fileAgeRaw.includes('Months')) fileAgeUnit = 'Months';

                        const fileSex = columns[3].replace(/"/g, '').trim() || 'Male';
                        const fileTestsString = columns[4].replace(/"/g, '').trim();
                        const fileNotes = columns[5] ? columns[5].replace(/"/g, '').trim() : 'Imported';

                        const testNames = fileTestsString.split('+').map(n => n.trim());
                        const resolvedBasket = testNames.map(name => {
                            const matched = testDirectory.find(t => t.name.toLowerCase() === name.toLowerCase());
                            return {
                                name: matched ? matched.name : name,
                                parameters: matched ? matched.parameters : 1,
                                type: matched ? matched.type : 'Inhouse'
                            };
                        });

                        const cumParams = resolvedBasket.reduce((sum, t) => sum + t.parameters, 0);

                        parsedRecords.push({
                            date: fileDate,
                            time: currentTimeString,
                            patientType: fileDept,
                            age: fileAge,
                            ageUnit: fileAgeUnit,
                            sex: fileSex,
                            testName: resolvedBasket.map(b => b.name).join(' + '),
                            basketItems: resolvedBasket,
                            parametersPerTest: cumParams,
                            totalTests: resolvedBasket.length,
                            totalParameters: cumParams,
                            notes: fileNotes
                        });
                    }

                    if (parsedRecords.length === 0) {
                        alert("Could not extract clean records from CSV.");
                        return;
                    }

                    try {
                        const { data, error } = await supabase
                            .from('lab_entries')
                            .insert(parsedRecords)
                            .select();

                        if (error) throw error;
                        setEntries(prev => [...data, ...prev]);
                        alert(`Successfully imported ${data.length} records!`);
                    } catch (err) {
                        alert("Error importing records: " + err.message);
                    }
                };
                reader.readAsText(file);
            };

            const deleteEntry = async (id) => {
                if (window.confirm("Are you sure you want to delete this specific record?")) {
                    try {
                        const { error } = await supabase.from('lab_entries').delete().eq('id', id);
                        if (error) throw error;
                        setEntries(prev => prev.filter(entry => entry.id !== id));
                        if(editingRecordId === id) cancelEditing();
                    } catch (err) {
                        alert("Error removing record: " + err.message);
                    }
                }
            };

            const deleteTestFromDirectory = async (indexToDelete) => {
                if (testDirectory.length <= 1) {
                    alert("You must maintain at least 1 test profile in your directory.");
                    return;
                }
                const testObj = testDirectory[indexToDelete];
                if (window.confirm(`Delete "${testObj.name}" from your directory?`)) {
                    try {
                        const { error } = await supabase.from('test_directory').delete().eq('id', testObj.id);
                        if (error) throw error;
                        setTestDirectory(prev => prev.filter((_, idx) => idx !== indexToDelete));
                        setSelectedTestIndex('0');
                    } catch (err) {
                        alert("Error deleting test profile: " + err.message);
                    }
                }
            };

            const clearAllData = async () => {
                if (window.confirm("CRITICAL WARNING: This permanently clears ALL historically logged records across ALL months! Proceed?")) {
                    if (window.confirm("SECOND CONFIRMATION: Are you 100% sure you want to wipe the entire database?")) {
                        try {
                            const { error } = await supabase.from('lab_entries').delete().neq('notes', 'SYSTEM_RESERVED_VAL_xyz_9999'); 
                            if (error) throw error;
                            setEntries([]);
                            cancelEditing();
                        } catch (err) {
                            alert("Error resetting database: " + err.message);
                        }
                    }
                }
            };

            const getAvailableMonths = () => {
                const monthsSet = new Set();
                monthsSet.add(getCurrentMonthString());
                
                entries.forEach(e => {
                    const parsed = parseDateParts(e.date);
                    if (parsed && parsed.monthKey) {
                        monthsSet.add(parsed.monthKey);
                    }
                });
                return Array.from(monthsSet).sort((a, b) => b.localeCompare(a));
            };

            const filteredEntries = entries.filter(entry => {
                const parsed = parseDateParts(entry.date);
                if (!parsed) return false;
                return parsed.monthKey === selectedMonth;
            });

            const metrics = filteredEntries.reduce((acc, curr) => {
                if (curr.patientType === 'OPD') {
                    acc.opdPatients += 1;
                    acc.opdParameters += (curr.totalParameters || 0);
                } else {
                    acc.ipdPatients += 1;
                    acc.ipdParameters += (curr.totalParameters || 0);
                }
                acc.totalPatients += 1;
                acc.totalParameters += (curr.totalParameters || 0);

                const items = getEntryBasketItems(curr);
                acc.totalTests += (items.length || curr.totalTests || 0);

                items.forEach(item => {
                    if (item.name) {
                        acc.individualTestCounts[item.name] = (acc.individualTestCounts[item.name] || 0) + 1;
                        
                        const match = testDirectory.find(t => t.name.toLowerCase() === item.name.trim().toLowerCase());
                        const itemType = item.type || (match ? match.type : 'Inhouse');

                        if (itemType === 'Inhouse') {
                            acc.totalInhouseTests += 1;
                        } else {
                            acc.totalOuthouseTests += 1;
                        }
                    }
                });

                return acc;
            }, { 
                opdPatients: 0, ipdPatients: 0, totalPatients: 0, totalParameters: 0, totalTests: 0,
                opdParameters: 0, ipdParameters: 0, totalInhouseTests: 0, totalOuthouseTests: 0,
                individualTestCounts: {}
            });

            const openCardBreakdown = (categoryFilter = 'ALL') => {
                const breakdownMap = {};

                filteredEntries.forEach(entry => {
                    const isOPD = entry.patientType === 'OPD';
                    const isIPD = entry.patientType === 'IPD';
                    const items = getEntryBasketItems(entry);

                    items.forEach(item => {
                        const tName = item.name.trim();
                        const matchDir = testDirectory.find(td => td.name.trim().toLowerCase() === tName.toLowerCase());
                        const perTestParams = (item.parameters && Number(item.parameters) > 0) ? Number(item.parameters) : (matchDir ? matchDir.parameters : 1);
                        const itemType = matchDir ? matchDir.type : (item.type || 'Inhouse');

                        let include = false;
                        if (categoryFilter === 'ALL' || categoryFilter === 'PATIENTS') {
                            include = true;
                        } else if (categoryFilter === 'OPD' && isOPD) {
                            include = true;
                        } else if (categoryFilter === 'IPD' && isIPD) {
                            include = true;
                        } else if (categoryFilter === 'INHOUSE' && itemType === 'Inhouse') {
                            include = true;
                        } else if (categoryFilter === 'OUTHOUSE' && itemType === 'Outhouse') {
                            include = true;
                        }

                        if (include) {
                            if (!breakdownMap[tName]) {
                                breakdownMap[tName] = {
                                    name: tName,
                                    perTestParams,
                                    type: itemType,
                                    opdTests: 0,
                                    opdParams: 0,
                                    ipdTests: 0,
                                    ipdParams: 0
                                };
                            }

                            if (isOPD) {
                                breakdownMap[tName].opdTests += 1;
                                breakdownMap[tName].opdParams += perTestParams;
                            } else if (isIPD) {
                                breakdownMap[tName].ipdTests += 1;
                                breakdownMap[tName].ipdParams += perTestParams;
                            }
                        }
                    });
                });

                const dataArray = Object.values(breakdownMap).sort((a, b) => (b.opdParams + b.ipdParams) - (a.opdParams + a.ipdParams));
                
                let title = "Tested Parameters & Volume Breakdown";
                let subtitle = `Detailed OPD vs IPD Metrics (${formatMonthDisplay(selectedMonth)})`;

                if (categoryFilter === 'OPD') title = "OPD Parameter & Test Breakdown";
                else if (categoryFilter === 'IPD') title = "IPD Parameter & Test Breakdown";
                else if (categoryFilter === 'INHOUSE') title = "Inhouse Tests Parameter Breakdown";
                else if (categoryFilter === 'OUTHOUSE') title = "Outhouse Tests Parameter Breakdown";

                setDetailModal({ show: true, title, subtitle, data: dataArray });
            };

            const openTestDateBreakdown = (testName) => {
                const dateMap = {};

                filteredEntries.forEach(entry => {
                    const parsed = parseDateParts(entry.date);
                    const entryDate = parsed ? parsed.full : entry.date;
                    const isOPD = entry.patientType === 'OPD';
                    const isIPD = entry.patientType === 'IPD';
                    const items = getEntryBasketItems(entry);

                    items.forEach(item => {
                        if (item.name.trim().toLowerCase() === testName.trim().toLowerCase()) {
                            const matchDir = testDirectory.find(td => td.name.trim().toLowerCase() === testName.trim().toLowerCase());
                            const perTestParams = matchDir ? matchDir.parameters : (item.parameters || 1);

                            if (!dateMap[entryDate]) {
                                dateMap[entryDate] = {
                                    date: entryDate,
                                    opdCount: 0,
                                    ipdCount: 0,
                                    totalCount: 0,
                                    totalParams: 0
                                };
                            }

                            if (isOPD) dateMap[entryDate].opdCount += 1;
                            if (isIPD) dateMap[entryDate].ipdCount += 1;

                            dateMap[entryDate].totalCount += 1;
                            dateMap[entryDate].totalParams += perTestParams;
                        }
                    });
                });

                const dateWiseData = Object.values(dateMap).sort((a, b) => {
                    const [d1, m1, y1] = a.date.split('/').map(Number);
                    const [d2, m2, y2] = b.date.split('/').map(Number);
                    return new Date(y1, m1 - 1, d1) - new Date(y2, m2 - 1, d2);
                });

                setTestDateModal({ show: true, testName, dateWiseData });
            };

            const exportToCSV = () => {
                if (filteredEntries.length === 0) return alert("No metrics logged in this window to export.");

                const seniors = filteredEntries.filter(e => {
                    const ageNum = Number(e.age) || 0;
                    const unit = (e.ageUnit || 'Years').toLowerCase();
                    return unit === 'years' && ageNum >= 60;
                });

                const seniorStats = seniors.reduce((acc, curr) => {
                    const isOPD = curr.patientType === 'OPD';
                    const sex = (curr.sex || '').toLowerCase();

                    if (sex === 'male') {
                        if (isOPD) acc.opdMale += 1;
                        else acc.ipdMale += 1;
                        acc.totalMale += 1;
                    } else if (sex === 'female') {
                        if (isOPD) acc.opdFemale += 1;
                        else acc.ipdFemale += 1;
                        acc.totalFemale += 1;
                    }
                    return acc;
                }, { opdMale: 0, ipdMale: 0, totalMale: 0, opdFemale: 0, ipdFemale: 0, totalFemale: 0 });

                const uniqueDatesSet = new Set();
                filteredEntries.forEach(e => {
                    const p = parseDateParts(e.date);
                    if (p) uniqueDatesSet.add(p.full);
                });
                const sortedDates = Array.from(uniqueDatesSet).sort((a, b) => {
                    const [d1, m1, y1] = a.split('/').map(Number);
                    const [d2, m2, y2] = b.split('/').map(Number);
                    return new Date(y1, m1 - 1, d1) - new Date(y2, m2 - 1, d2);
                });

                const uniqueTestNamesSet = new Set();
                testDirectory.forEach(t => uniqueTestNamesSet.add(t.name.trim()));
                filteredEntries.forEach(e => {
                    const items = getEntryBasketItems(e);
                    items.forEach(item => { if (item.name) uniqueTestNamesSet.add(item.name.trim()); });
                });
                const allTestNames = Array.from(uniqueTestNamesSet).filter(Boolean);

                const matrixCount = {};
                allTestNames.forEach(tName => {
                    matrixCount[tName] = {};
                    sortedDates.forEach(dStr => {
                        const matchDir = testDirectory.find(td => td.name.trim() === tName);
                        matrixCount[tName][dStr] = {
                            testCount: 0,
                            paramWeight: matchDir ? matchDir.parameters : 0,
                            type: matchDir ? matchDir.type : 'Inhouse'
                        };
                    });
                });

                filteredEntries.forEach(e => {
                    const p = parseDateParts(e.date);
                    const dStr = p ? p.full : e.date;
                    const items = getEntryBasketItems(e);
                    items.forEach(item => {
                        const targetedName = item.name.trim();
                        if (matrixCount[targetedName] && matrixCount[targetedName][dStr] !== undefined) {
                            matrixCount[targetedName][dStr].testCount += 1;
                            if (item.parameters && Number(item.parameters) > 0) {
                                matrixCount[targetedName][dStr].paramWeight = Number(item.parameters);
                            }
                        }
                    });
                });

                const p1Headers = ["Test Profile Title", "Routing Type"];
                sortedDates.forEach(date => {
                    p1Headers.push(`"${date} (Volume)"`);
                    p1Headers.push(`"${date} (Parameters)"`);
                });
                p1Headers.push("Cumulative Volume", "Cumulative Parameters");

                const p1Rows = [];

                const inhouseTestNames = allTestNames.filter(tName => {
                    const sampleObj = matrixCount[tName][sortedDates[0]] || { type: 'Inhouse' };
                    return sampleObj.type === 'Inhouse';
                });

                const outhouseTestNames = allTestNames.filter(tName => {
                    const sampleObj = matrixCount[tName][sortedDates[0]] || { type: 'Inhouse' };
                    return sampleObj.type === 'Outhouse';
                });

                const inhouseColumnTotals = {};
                const outhouseColumnTotals = {};
                sortedDates.forEach(dStr => {
                    inhouseColumnTotals[dStr] = { tests: 0, params: 0 };
                    outhouseColumnTotals[dStr] = { tests: 0, params: 0 };
                });

                let ihGrandTotalTests = 0, ihGrandTotalParams = 0;
                let ohGrandTotalTests = 0, ohGrandTotalParams = 0;

                p1Rows.push('"--- INHOUSE LAB TESTS ---",""');
                inhouseTestNames.forEach(tName => {
                    const sampleObj = matrixCount[tName][sortedDates[0]] || { type: 'Inhouse' };
                    const rowCells = [`"${tName.replace(/"/g, '""')}"`, `"${sampleObj.type}"`];
                    let rowTotalTests = 0;
                    let rowTotalParams = 0;

                    sortedDates.forEach(date => {
                        const count = matrixCount[tName][date].testCount || 0;
                        const weight = matrixCount[tName][date].paramWeight || 0;
                        const calculatedParams = count * weight;

                        rowCells.push(count);
                        rowCells.push(calculatedParams);

                        rowTotalTests += count;
                        rowTotalParams += calculatedParams;

                        inhouseColumnTotals[date].tests += count;
                        inhouseColumnTotals[date].params += calculatedParams;
                    });

                    rowCells.push(rowTotalTests);
                    rowCells.push(rowTotalParams);
                    ihGrandTotalTests += rowTotalTests;
                    ihGrandTotalParams += rowTotalParams;

                    p1Rows.push(rowCells.join(","));
                });

                const ihTotalRow = ['"SUBTOTAL (INHOUSE COUNT)"', '"-"'];
                sortedDates.forEach(date => {
                    ihTotalRow.push(inhouseColumnTotals[date].tests);
                    ihTotalRow.push(inhouseColumnTotals[date].params);
                });
                ihTotalRow.push(ihGrandTotalTests);
                ihTotalRow.push(ihGrandTotalParams);
                p1Rows.push(ihTotalRow.join(","));

                p1Rows.push('"",""');

                p1Rows.push('"--- OUTHOUSE REFERRED TESTS ---",""');
                outhouseTestNames.forEach(tName => {
                    const sampleObj = matrixCount[tName][sortedDates[0]] || { type: 'Outhouse' };
                    const rowCells = [`"${tName.replace(/"/g, '""')}"`, `"${sampleObj.type}"`];
                    let rowTotalTests = 0;
                    let rowTotalParams = 0;

                    sortedDates.forEach(date => {
                        const count = matrixCount[tName][date].testCount || 0;
                        const weight = matrixCount[tName][date].paramWeight || 0;
                        const calculatedParams = count * weight;

                        rowCells.push(count);
                        rowCells.push(calculatedParams);

                        rowTotalTests += count;
                        rowTotalParams += calculatedParams;

                        outhouseColumnTotals[date].tests += count;
                        outhouseColumnTotals[date].params += calculatedParams;
                    });

                    rowCells.push(rowTotalTests);
                    rowCells.push(rowTotalParams);
                    ohGrandTotalTests += rowTotalTests;
                    ohGrandTotalParams += rowTotalParams;

                    p1Rows.push(rowCells.join(","));
                });

                const ohTotalRow = ['"SUBTOTAL (OUTHOUSE COUNT)"', '"-"'];
                sortedDates.forEach(date => {
                    ohTotalRow.push(outhouseColumnTotals[date].tests);
                    ohTotalRow.push(outhouseColumnTotals[date].params);
                });
                ohTotalRow.push(ohGrandTotalTests);
                ohTotalRow.push(ohGrandTotalParams);
                p1Rows.push(ohTotalRow.join(","));

                p1Rows.push('"",""'); 

                const finalTotalRow = ['"GRAND TOTAL COMBINED"', '"-"'];
                sortedDates.forEach(date => {
                    finalTotalRow.push(inhouseColumnTotals[date].tests + outhouseColumnTotals[date].tests);
                    finalTotalRow.push(inhouseColumnTotals[date].params + outhouseColumnTotals[date].params);
                });
                finalTotalRow.push(ihGrandTotalTests + ohGrandTotalTests);
                finalTotalRow.push(ihGrandTotalParams + ohGrandTotalParams);
                p1Rows.push(finalTotalRow.join(","));

                const demographicSection = 
                    "\n\n===================================================\n" +
                    `SECTION 2: SENIOR PATIENTS DEMOGRAPHICS (AGE 60 AND ABOVE) (${selectedMonth})\n` +
                    "===================================================\n" +
                    "Gender,OPD Count,IPD Count,Total Count\n" +
                    `Male,${seniorStats.opdMale},${seniorStats.ipdMale},${seniorStats.totalMale}\n` +
                    `Female,${seniorStats.opdFemale},${seniorStats.ipdFemale},${seniorStats.totalFemale}\n` +
                    `Total Senior Patients,${seniorStats.opdMale + seniorStats.opdFemale},${seniorStats.ipdMale + seniorStats.ipdFemale},${seniorStats.totalMale + seniorStats.totalFemale}`;

                const finalCsvString = 
                    "===================================================\n" +
                    `SECTION 1: SPREADSHEET MATRIX SUMMARY REPORT (${selectedMonth})\n` +
                    "===================================================\n" +
                    p1Headers.join(",") + "\n" + 
                    p1Rows.join("\n") +
                    demographicSection;

                const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), finalCsvString], { type: "text/csv;charset=utf-8;" });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `Lab_Summary_${selectedMonth}_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const formatMonthDisplay = (monthStr) => {
                if (!monthStr || !monthStr.includes('-')) return monthStr;
                const [year, month] = monthStr.split('-');
                const date = new Date(year, parseInt(month, 10) - 1, 1);
                return date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            };

            const navPages = [
                { id: 'entry', label: 'Patient Lab Entry Terminal', icon: '🧪' },
                { id: 'snapshot', label: 'Snapshot Metrics Window', icon: '📊' },
                { id: 'catalog', label: 'Menu Distribution Catalog Diagnostics', icon: '📋' },
                { id: 'logs', label: 'Active Database Session Logs', icon: '🗄️', badge: filteredEntries.length }
            ];

            return (
                <div className="min-h-screen p-4 md:p-6 text-slate-800 max-w-7xl mx-auto">
                    {/* Header Banner */}
                    <header className="mb-4 flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-200 pb-4 gap-4">
                        <div>
                            <h1 className="text-2xl md:text-3xl font-black text-teal-800 tracking-tight">Lab Statistics Tracker Terminal</h1>
                            <p className="text-xs text-slate-500 mt-0.5 font-medium">
                                Real-time cloud pipeline • <span className="text-teal-700 font-bold">{entries.length} total records</span> preserved across <span className="text-teal-700 font-bold">{getAvailableMonths().length} month(s)</span>.
                            </p>
                        </div>
                        <div className="flex flex-wrap items-center gap-2 w-full md:w-auto">
                            {/* Monthly View Window Selector */}
                            <div className="flex items-center bg-teal-50 border border-teal-200 rounded-lg px-2.5 py-1.5 shrink-0">
                                <label className="text-[10px] font-black text-teal-800 uppercase tracking-wider mr-2">View Window:</label>
                                <select 
                                    value={selectedMonth} 
                                    onChange={(e) => setSelectedMonth(e.target.value)}
                                    className="bg-transparent text-xs font-bold text-teal-900 focus:outline-none cursor-pointer"
                                >
                                    {getAvailableMonths().map((mStr) => {
                                        const countForMonth = entries.filter(en => {
                                            const p = parseDateParts(en.date);
                                            return p && p.monthKey === mStr;
                                        }).length;
                                        return (
                                            <option key={mStr} value={mStr}>
                                                {formatMonthDisplay(mStr)} ({countForMonth}) {mStr === getCurrentMonthString() ? '[Current]' : ''}
                                            </option>
                                        );
                                    })}
                                </select>
                            </div>
                            <button onClick={() => setShowTestModal(true)} className="bg-slate-600 hover:bg-slate-700 text-white px-3 py-2 rounded-lg text-xs font-bold transition shadow-sm">
                                ⚙️ Setup Test Library
                            </button>
                            <button onClick={exportToCSV} className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-xs font-bold transition shadow-sm">
                                📥 Download (.CSV)
                            </button>
                            <button onClick={clearAllData} className="bg-rose-600 hover:bg-rose-700 text-white px-3 py-2 rounded-lg text-xs font-bold transition shadow-sm">
                                ⚠ Reset All
                            </button>
                        </div>
                    </header>

                    {/* 4-Page Navigation Tabs */}
                    <nav className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5 mb-6 bg-white p-2 rounded-xl border border-slate-200 shadow-sm">
                        {navPages.map(page => {
                            const isActive = activePage === page.id;
                            return (
                                <button
                                    key={page.id}
                                    onClick={() => setActivePage(page.id)}
                                    className={`flex items-center justify-between px-3.5 py-2.5 rounded-lg text-xs font-black transition text-left ${
                                        isActive 
                                            ? 'bg-teal-700 text-white shadow-sm' 
                                            : 'bg-slate-50 text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                                    }`}
                                >
                                    <span className="flex items-center gap-2 truncate">
                                        <span className="text-sm">{page.icon}</span>
                                        <span className="truncate">{page.label}</span>
                                    </span>
                                    {page.badge !== undefined && (
                                        <span className={`ml-2 px-1.5 py-0.5 rounded text-[10px] font-black shrink-0 ${
                                            isActive ? 'bg-teal-900 text-teal-100' : 'bg-slate-200 text-slate-700'
                                        }`}>
                                            {page.badge}
                                        </span>
                                    )}
                                </button>
                            );
                        })}
                    </nav>

                    {isLoading && (
                        <div className="mb-6 p-3 bg-teal-50 border border-teal-200 rounded-lg text-xs font-bold text-teal-800 flex items-center gap-2">
                            <span className="animate-spin">⏳</span> Syncing complete multi-month historical database...
                        </div>
                    )}

                    {/* ===================================================================== */}
                    {/* PAGE 1: SNAPSHOT METRICS WINDOW                                       */}
                    {/* ===================================================================== */}
                    {activePage === 'snapshot' && (
                        <div className="space-y-4">
                            <div className="px-1 flex flex-wrap justify-between items-center gap-2">
                                <h3 className="text-sm font-black text-slate-700 uppercase tracking-wider">
                                    📊 Snapshot Metrics Window: <span className="text-teal-700 font-extrabold">{formatMonthDisplay(selectedMonth)}</span>
                                    <span className="text-[11px] text-slate-400 font-normal ml-2">(Click any card for parameter breakdown)</span>
                                </h3>
                                <span className="text-xs bg-teal-50 border border-teal-200 text-teal-800 font-bold px-2.5 py-1 rounded">
                                    Showing {filteredEntries.length} records in {formatMonthDisplay(selectedMonth)} (Total Database: {entries.length})
                                </span>
                            </div>

                            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">
                                <div onClick={() => openCardBreakdown('ALL')} className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-t-4 border-t-slate-700 cursor-pointer hover:shadow-md transition hover:scale-[1.01]">
                                    <div className="flex justify-between items-start">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total Patients</p>
                                        <span className="text-xs">🔍</span>
                                    </div>
                                    <p className="text-2xl font-black text-slate-800 mt-1">{metrics.totalPatients}</p>
                                </div>
                                <div onClick={() => openCardBreakdown('OPD')} className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-teal-600 cursor-pointer hover:shadow-md transition hover:scale-[1.01]">
                                    <div className="flex justify-between items-start">
                                        <p className="text-[10px] font-bold text-teal-600 uppercase tracking-wider">OPD Patients</p>
                                        <span className="text-xs">🔍</span>
                                    </div>
                                    <p className="text-2xl font-black text-teal-700 mt-1">{metrics.opdPatients}</p>
                                </div>
                                <div onClick={() => openCardBreakdown('IPD')} className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-indigo-600 cursor-pointer hover:shadow-md transition hover:scale-[1.01]">
                                    <div className="flex justify-between items-start">
                                        <p className="text-[10px] font-bold text-indigo-600 uppercase tracking-wider">IPD Patients</p>
                                        <span className="text-xs">🔍</span>
                                    </div>
                                    <p className="text-2xl font-black text-indigo-700 mt-1">{metrics.ipdPatients}</p>
                                </div>
                                <div onClick={() => openCardBreakdown('ALL')} className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-t-4 border-t-cyan-600 cursor-pointer hover:shadow-md transition hover:scale-[1.01]">
                                    <div className="flex justify-between items-start">
                                        <p className="text-[10px] font-bold text-cyan-600 uppercase tracking-wider">Total Tests Vol</p>
                                        <span className="text-xs">🔍</span>
                                    </div>
                                    <p className="text-2xl font-black text-cyan-700 mt-1">{metrics.totalTests}</p>
                                </div>
                                <div onClick={() => openCardBreakdown('ALL')} className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-purple-600 cursor-pointer hover:shadow-md transition hover:scale-[1.01]">
                                    <div className="flex justify-between items-start">
                                        <p className="text-[10px] font-bold text-purple-600 uppercase tracking-wider">Total Parameters</p>
                                        <span className="text-xs">🔍</span>
                                    </div>
                                    <p className="text-2xl font-black text-purple-700 mt-1">{metrics.totalParameters}</p>
                                </div>
                                <div onClick={() => openCardBreakdown('OPD')} className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-b-4 border-b-teal-500 cursor-pointer hover:shadow-md transition hover:scale-[1.01]">
                                    <div className="flex justify-between items-start">
                                        <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">OPD Parameters</p>
                                        <span className="text-xs">🔍</span>
                                    </div>
                                    <p className="text-2xl font-black text-teal-600 mt-1">{metrics.opdParameters}</p>
                                </div>
                                <div onClick={() => openCardBreakdown('IPD')} className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-b-4 border-b-indigo-500 cursor-pointer hover:shadow-md transition hover:scale-[1.01]">
                                    <div className="flex justify-between items-start">
                                        <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">IPD Parameters</p>
                                        <span className="text-xs">🔍</span>
                                    </div>
                                    <p className="text-2xl font-black text-indigo-600 mt-1">{metrics.ipdParameters}</p>
                                </div>
                                <div onClick={() => openCardBreakdown('INHOUSE')} className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-emerald-600 cursor-pointer hover:shadow-md transition hover:scale-[1.01]">
                                    <div className="flex justify-between items-start">
                                        <p className="text-[10px] font-bold text-emerald-600 uppercase tracking-wider">Inhouse Processed</p>
                                        <span className="text-xs">🔍</span>
                                    </div>
                                    <p className="text-2xl font-black text-emerald-700 mt-1">{metrics.totalInhouseTests}</p>
                                </div>
                                <div onClick={() => openCardBreakdown('OUTHOUSE')} className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-amber-500 cursor-pointer hover:shadow-md transition hover:scale-[1.01]">
                                    <div className="flex justify-between items-start">
                                        <p className="text-[10px] font-bold text-amber-600 uppercase tracking-wider">Outhouse Referred</p>
                                        <span className="text-xs">🔍</span>
                                    </div>
                                    <p className="text-2xl font-black text-amber-700 mt-1">{metrics.totalOuthouseTests}</p>
                                </div>
                            </div>

                            {/* Historical Month-by-Month Summary Overview Table */}
                            <div className="bg-white rounded-xl border border-slate-200 p-4 mt-6 shadow-sm">
                                <h4 className="text-xs font-black text-slate-600 uppercase tracking-wider mb-3">📅 Historical Archive Overview (All Preserved Months)</h4>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs border-collapse">
                                        <thead>
                                            <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase text-[10px] font-black">
                                                <th className="p-2.5">Month Window</th>
                                                <th className="p-2.5 text-center">Patients</th>
                                                <th className="p-2.5 text-center">OPD / IPD</th>
                                                <th className="p-2.5 text-center">Total Tests</th>
                                                <th className="p-2.5 text-right">Total Parameters</th>
                                                <th className="p-2.5 text-center">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {getAvailableMonths().map(mStr => {
                                                const mEntries = entries.filter(en => {
                                                    const p = parseDateParts(en.date);
                                                    return p && p.monthKey === mStr;
                                                });
                                                const opd = mEntries.filter(e => e.patientType === 'OPD').length;
                                                const ipd = mEntries.filter(e => e.patientType !== 'OPD').length;
                                                const tests = mEntries.reduce((s, e) => s + getEntryBasketItems(e).length, 0);
                                                const params = mEntries.reduce((s, e) => s + (e.totalParameters || 0), 0);
                                                return (
                                                    <tr key={mStr} className={mStr === selectedMonth ? 'bg-teal-50/60 font-bold' : 'hover:bg-slate-50'}>
                                                        <td className="p-2.5 font-bold text-slate-800">{formatMonthDisplay(mStr)}</td>
                                                        <td className="p-2.5 text-center font-bold">{mEntries.length}</td>
                                                        <td className="p-2.5 text-center text-slate-600">{opd} OPD / {ipd} IPD</td>
                                                        <td className="p-2.5 text-center text-cyan-700 font-bold">{tests}</td>
                                                        <td className="p-2.5 text-right font-mono font-bold text-purple-700">{params}</td>
                                                        <td className="p-2.5 text-center">
                                                            <button
                                                                onClick={() => setSelectedMonth(mStr)}
                                                                className={`px-2.5 py-1 rounded text-[10px] font-bold ${mStr === selectedMonth ? 'bg-teal-700 text-white' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'}`}
                                                            >
                                                                {mStr === selectedMonth ? 'Active' : 'Inspect'}
                                                            </button>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ===================================================================== */}
                    {/* PAGE 2: MENU DISTRIBUTION CATALOG DIAGNOSTICS                         */}
                    {/* ===================================================================== */}
                    {activePage === 'catalog' && (
                        <div className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                            <div className="flex flex-wrap justify-between items-center mb-4 pb-3 border-b border-slate-100 gap-2">
                                <div>
                                    <h2 className="text-base font-black text-slate-800 uppercase tracking-wider">📋 Menu Distribution Catalog Diagnostics ({formatMonthDisplay(selectedMonth)})</h2>
                                    <p className="text-xs text-slate-400 font-medium mt-0.5">Click any diagnostic test card to view its date-wise OPD/IPD execution log.</p>
                                </div>
                                <button onClick={() => setShowTestModal(true)} className="bg-teal-600 hover:bg-teal-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">
                                    + Manage Test Library
                                </button>
                            </div>
                            {testDirectory.length === 0 ? (
                                <p className="text-xs text-slate-400 italic py-10 text-center">No directory profiles mapped yet.</p>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3.5">
                                    {testDirectory.map((test, index) => {
                                        const currentCount = metrics.individualTestCounts[test.name] || 0;
                                        const totalTestParams = currentCount * (test.parameters || 1);
                                        return (
                                            <div 
                                                key={index} 
                                                onClick={() => openTestDateBreakdown(test.name)}
                                                className="bg-slate-50/70 p-3.5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between cursor-pointer hover:bg-white hover:border-teal-500 hover:ring-2 hover:ring-teal-500/15 transition"
                                            >
                                                <div className="flex justify-between items-start gap-2">
                                                    <span className="text-xs font-bold text-slate-800 leading-snug" title={test.name}>{test.name}</span>
                                                    <span className={`text-[9px] px-1.5 py-0.5 rounded font-black tracking-tight shrink-0 ${test.type === 'Outhouse' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>
                                                        {test.type === 'Outhouse' ? 'OH' : 'IH'}
                                                    </span>
                                                </div>
                                                <div className="mt-2 text-[10px] text-slate-500 font-semibold">
                                                    Weight: <span className="text-slate-700 font-bold">{test.parameters} param(s)</span> • Month Params: <span className="text-purple-700 font-bold">{totalTestParams}</span>
                                                </div>
                                                <div className="flex justify-between items-baseline mt-3 pt-2 border-t border-slate-200/80">
                                                    <span className="text-lg font-black text-teal-700">{currentCount} <span className="text-[11px] font-normal text-slate-500">tests</span></span>
                                                    <span className="text-[10px] font-bold text-teal-600">📅 View Dates &rarr;</span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    )}

                    {/* ===================================================================== */}
                    {/* PAGE 3: PATIENT LAB ENTRY TERMINAL                                    */}
                    {/* ===================================================================== */}
                    {activePage === 'entry' && (
                        <div className="max-w-3xl mx-auto space-y-5">
                            <div className="p-4 bg-white rounded-xl border-2 border-dashed border-slate-300 hover:border-teal-500 transition relative flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm">
                                <div className="flex items-center gap-3">
                                    <span className="text-2xl">📄</span>
                                    <div>
                                        <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wide">Import CSV Data Sheet</h4>
                                        <p className="text-[11px] text-slate-400 font-medium">Upload a `.csv` log sheet. New rows append safely without overwriting past months.</p>
                                    </div>
                                </div>
                                <input 
                                    type="file" 
                                    accept=".csv,.txt" 
                                    onChange={handleFileUpload}
                                    className="text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-bold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 cursor-pointer"
                                />
                            </div>

                            <div className={`p-6 rounded-xl shadow-sm border transition-all ${editingRecordId ? 'bg-amber-50/70 border-amber-300 ring-2 ring-amber-400/20' : 'bg-white border-slate-200'}`}>
                                <div className="flex justify-between items-center mb-5 border-b pb-3">
                                    <h2 className="text-lg font-black text-slate-800">{editingRecordId ? '📝 Edit Patient Record Line' : '🧪 Patient Lab Entry Terminal'}</h2>
                                    {editingRecordId && (
                                        <button onClick={cancelEditing} className="text-xs font-bold text-amber-700 hover:underline bg-amber-100 px-2.5 py-1 rounded">
                                            Cancel Edit
                                        </button>
                                    )}
                                </div>
                                
                                <form onSubmit={handleSubmitEntry} className="space-y-4">
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 tracking-wider">Department Routing</label>
                                        <div className="grid grid-cols-2 gap-3">
                                            <button
                                                type="button"
                                                onClick={() => setPatientType('OPD')}
                                                className={`py-2.5 text-center rounded-lg font-bold transition text-xs ${patientType === 'OPD' ? 'bg-teal-50 text-teal-700 border-2 border-teal-600' : 'bg-slate-100 text-slate-600 border border-transparent hover:bg-slate-200'}`}
                                            >
                                                OPD (Outpatient)
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setPatientType('IPD')}
                                                className={`py-2.5 text-center rounded-lg font-bold transition text-xs ${patientType === 'IPD' ? 'bg-indigo-50 text-indigo-700 border-2 border-indigo-600' : 'bg-slate-100 text-slate-600 border border-transparent hover:bg-slate-200'}`}
                                            >
                                                IPD (Inpatient)
                                            </button>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">Logging Entry Date (dd/mm/yy)</label>
                                        <input
                                            type="text"
                                            placeholder="dd/mm/yy"
                                            maxLength="8"
                                            value={customDate}
                                            onChange={(e) => handleCustomDateChange(e.target.value)}
                                            className="w-full p-2.5 border border-slate-300 rounded-lg text-xs bg-white font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-500"
                                        />
                                    </div>

                                    <div className="grid grid-cols-12 gap-3">
                                        <div className="col-span-3">
                                            <label className="block text-xs font-bold text-slate-600 mb-1">Age</label>
                                            <input
                                                type="number"
                                                min="1"
                                                placeholder="35"
                                                value={patientAge}
                                                onChange={(e) => setPatientAge(e.target.value)}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-xs font-semibold"
                                                required
                                            />
                                        </div>
                                        <div className="col-span-3">
                                            <label className="block text-xs font-bold text-slate-600 mb-1">Unit</label>
                                            <select
                                                value={patientAgeUnit}
                                                onChange={(e) => setPatientAgeUnit(e.target.value)}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg bg-white text-xs font-semibold"
                                            >
                                                <option value="Days">Days</option>
                                                <option value="Months">Months</option>
                                                <option value="Years">Years</option>
                                            </select>
                                        </div>
                                        <div className="col-span-3">
                                            <label className="block text-xs font-bold text-slate-600 mb-1">Sex</label>
                                            <select
                                                value={patientSex}
                                                onChange={(e) => setPatientSex(e.target.value)}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg bg-white text-xs font-semibold"
                                            >
                                                <option value="Male">Male</option>
                                                <option value="Female">Female</option>
                                                <option value="Other">Other</option>
                                            </select>
                                        </div>
                                        <div className="col-span-3">
                                            <label className="block text-xs font-bold text-slate-600 mb-1">Batch</label>
                                            <input
                                                type="number"
                                                min="1"
                                                disabled={!!editingRecordId}
                                                value={patientCount}
                                                onChange={(e) => setPatientCount(e.target.value)}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-xs font-black bg-slate-50 text-teal-700 disabled:opacity-50"
                                                required
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">Select Diagnostic Profile Item</label>
                                        <div className="flex gap-2">
                                            <select
                                                value={selectedTestIndex}
                                                onChange={(e) => setSelectedTestIndex(e.target.value)}
                                                className="flex-1 p-2.5 border border-slate-300 rounded-lg bg-white text-xs font-semibold"
                                            >
                                                {testDirectory.map((test, index) => (
                                                    <option key={index} value={index}>
                                                        {test.name} [{test.type === 'Outhouse' ? 'OH' : 'IH'}] ({test.parameters} params)
                                                    </option>
                                                ))}
                                            </select>
                                            <button
                                                type="button"
                                                onClick={addTestToBasket}
                                                className="bg-teal-600 hover:bg-teal-700 text-white font-bold px-4 rounded-lg text-xs whitespace-nowrap"
                                            >
                                                + Add Test
                                            </button>
                                        </div>
                                    </div>

                                    <div className="bg-slate-50 p-3.5 rounded-lg border border-slate-200">
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Active Bundle Basket ({selectedTestsBasket.length} tests)</label>
                                            {selectedTestsBasket.length > 0 && (
                                                <span className="text-[10px] font-black text-purple-700">
