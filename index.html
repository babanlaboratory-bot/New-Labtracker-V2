<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Laboratory Statistics Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Supabase Client Connection Setup ---
        const SUPABASE_URL = 'https://kilprsosrakeyhnhgtaf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpbHByc29zcmFrZXlobmhndGFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NDU4ODEsImV4cCI6MjEwNjQyMTg4MX0._znMFqmjVn6JPmVzKmcMb5iFs_Fnt91wLoWCzk4c7Xw';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function LabTracker() {
            // --- Main Application States ---
            const [entries, setEntries] = useState([]);
            const [testDirectory, setTestDirectory] = useState([]);
            const [editingRecordId, setEditingRecordId] = useState(null);

            // Modal States
            const [detailModal, setDetailModal] = useState({ show: false, title: '', subtitle: '', data: [] });
            const [testDateModal, setTestDateModal] = useState({ show: false, testName: '', dateWiseData: [] });

            const defaultTestDirectory = [
                { name: 'Glucose (Random/Fasting)', parameters: 1, type: 'Inhouse' },
                { name: 'Electrolytes (Na/K/Cl)', parameters: 3, type: 'Inhouse' },
                { name: 'Liver Function Test (LFT)', parameters: 9, type: 'Inhouse' },
                { name: 'Lipid Profile', parameters: 5, type: 'Outhouse' },
                { name: 'Complete Blood Count (CBC)', parameters: 18, type: 'Inhouse' }
            ];

            // Helper to get current date formatted as DD/MM/YY
            const getTodayDDMMYY = () => {
                const today = new Date();
                const day = String(today.getDate()).padStart(2, '0');
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const year = String(today.getFullYear()).slice(-2);
                return `${day}/${month}/${year}`;
            };

            const getCurrentMonthString = () => {
                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                return `${year}-${month}`; // YYYY-MM structure
            };

            const [patientType, setPatientType] = useState('OPD');
            const [patientAge, setPatientAge] = useState('');
            const [patientAgeUnit, setPatientAgeUnit] = useState('Years');
            const [patientSex, setPatientSex] = useState('Male');
            const [patientCount, setPatientCount] = useState('1');
            const [selectedTestIndex, setSelectedTestIndex] = useState('0');
            const [selectedTestsBasket, setSelectedTestsBasket] = useState([]);
            const [notes, setNotes] = useState('');
            
            // Format set to DD/MM/YY
            const [customDate, setCustomDate] = useState(getTodayDDMMYY());
            const [selectedMonth, setSelectedMonth] = useState(getCurrentMonthString());

            const [newTestName, setNewTestName] = useState('');
            const [newTestParams, setNewTestParams] = useState('');
            const [newTestType, setNewTestType] = useState('Inhouse');
            const [showTestModal, setShowTestModal] = useState(false);

            useEffect(() => {
                fetchInitialData();
            }, []);

            // Handle DD/MM/YY date input change and sync view month
            const handleCustomDateChange = (val) => {
                setCustomDate(val);
                // Attempt to parse DD/MM/YY
                const parts = val.split('/');
                if (parts.length === 3) {
                    const dd = parts[0];
                    const mm = parts[1];
                    let yy = parts[2];
                    if (mm.length === 2 && yy.length === 2 && !isNaN(mm) && !isNaN(yy)) {
                        const fullYear = `20${yy}`;
                        setSelectedMonth(`${fullYear}-${mm}`);
                    }
                }
            };

            // Convert DD/MM/YY or DD/MM/YYYY string to full DD/MM/YYYY for DB persistence
            const normalizeToFullDate = (dateStr) => {
                if (!dateStr) return new Date().toLocaleDateString('en-IN');
                const parts = dateStr.split('/');
                if (parts.length === 3) {
                    let [d, m, y] = parts;
                    if (y.length === 2) y = `20${y}`;
                    return `${d.padStart(2, '0')}/${m.padStart(2, '0')}/${y}`;
                }
                return dateStr;
            };

            // --- Database Sync Routines ---
            const fetchInitialData = async () => {
                try {
                    const { data: logData, error: logError } = await supabase
                        .from('lab_entries')
                        .select('*')
                        .order('created_at', { ascending: false });
                    
                    if (logError) throw logError;
                    if (logData) setEntries(logData);

                    let { data: testData, error: testError } = await supabase
                        .from('test_directory')
                        .select('*')
                        .order('id', { ascending: true });

                    if (testError) throw testError;

                    if (!testData || testData.length === 0) {
                        const seedPayload = defaultTestDirectory.map(t => ({
                            name: t.name,
                            parameters: t.parameters,
                            type: t.type
                        }));

                        const { data: seededData, error: seedError } = await supabase
                            .from('test_directory')
                            .insert(seedPayload)
                            .select('*');
                        
                        if (seedError) throw seedError;
                        testData = seededData;
                    }

                    if (testData) {
                        setTestDirectory(testData.map(t => ({
                            ...t,
                            type: t.type || 'Inhouse'
                        })));
                    }

                } catch (err) {
                    console.error("Database connection runtime error:", err.message);
                }
            };

            const addTestToBasket = () => {
                const testObj = testDirectory[parseInt(selectedTestIndex)];
                if (!testObj) return;

                if (selectedTestsBasket.some(t => t.name === testObj.name)) {
                    alert("This test is already included in the current patient bundle.");
                    return;
                }
                setSelectedTestsBasket([...selectedTestsBasket, testObj]);
            };

            const removeTestFromBasket = (indexToRemove) => {
                setSelectedTestsBasket(selectedTestsBasket.filter((_, idx) => idx !== indexToRemove));
            };

            const handleAddTestToDirectory = async (e) => {
                e.preventDefault();
                const name = newTestName.trim();
                const params = parseInt(newTestParams) || 0;

                if (!name || params <= 0) {
                    alert("Please enter a valid test name and parameter count greater than 0.");
                    return;
                }

                if (testDirectory.some(t => t.name.toLowerCase() === name.toLowerCase())) {
                    alert("A test with this name already exists!");
                    return;
                }

                try {
                    const { data, error } = await supabase
                        .from('test_directory')
                        .insert([{ name, parameters: params, type: newTestType }])
                        .select('*');

                    if (error) throw error;
                    
                    setTestDirectory([...testDirectory, data[0]]);
                    setNewTestName('');
                    setNewTestParams('');
                    setNewTestType('Inhouse');
                } catch (err) {
                    alert("Error saving test profile: " + err.message);
                }
            };

            const startEditing = (entry) => {
                setEditingRecordId(entry.id);
                setPatientType(entry.patientType);
                if (typeof entry.age === 'string') {
                    const parts = entry.age.split(' ');
                    if (parts.length === 2 && ['Days', 'Months', 'Years'].includes(parts[1])) {
                        setPatientAge(parts[0]);
                        setPatientAgeUnit(parts[1]);
                    } else {
                        setPatientAge(entry.age);
                        setPatientAgeUnit(entry.ageUnit || 'Years');
                    }
                } else {
                    setPatientAge(entry.age);
                    setPatientAgeUnit(entry.ageUnit || 'Years');
                }
                setPatientSex(entry.sex);
                setPatientCount('1');
                setNotes(entry.notes === 'N/A' ? '' : entry.notes);
                
                if (entry.date) {
                    const [day, month, year] = entry.date.split('/');
                    if (day && month && year) {
                        const shortYear = year.slice(-2);
                        setCustomDate(`${day}/${month}/${shortYear}`);
                    }
                }

                if (entry.basketItems) {
                    const reconstituted = entry.basketItems.map(item => {
                        const matched = testDirectory.find(t => t.name === item.name);
                        return {
                            name: item.name,
                            parameters: item.parameters,
                            type: matched ? matched.type : (item.type || 'Inhouse')
                        };
                    });
                    setSelectedTestsBasket(reconstituted);
                } else {
                    const splitNames = entry.testName.split(' + ');
                    const reconstituted = splitNames.map(name => {
                        const matched = testDirectory.find(t => t.name === name.trim());
                        return {
                            name: name.trim(),
                            parameters: matched ? matched.parameters : 1,
                            type: matched ? matched.type : 'Inhouse'
                        };
                    });
                    setSelectedTestsBasket(reconstituted);
                }
            };

            const cancelEditing = () => {
                setEditingRecordId(null);
                setPatientAge('');
                setPatientAgeUnit('Years');
                setPatientCount('1');
                setNotes('');
                setSelectedTestsBasket([]);
                setCustomDate(getTodayDDMMYY());
            };

            const handleSubmitEntry = async (e) => {
                e.preventDefault();
                const age = parseInt(patientAge) || 0;
                const count = parseInt(patientCount) || 1;

                if (age <= 0) return alert("Please enter a valid patient age.");
                if (selectedTestsBasket.length === 0) return alert("Please add at least one test to the bundle.");

                const dateRegex = /^\d{2}\/\d{2}\/\d{2}$/;
                if (!dateRegex.test(customDate)) {
                    return alert("Please enter a valid date in dd/mm/yy format (e.g. 29/09/26).");
                }

                const cumulativeParamsEach = selectedTestsBasket.reduce((sum, t) => sum + t.parameters, 0);
                const combinedTestNames = selectedTestsBasket.map(t => t.name).join(' + ');
                const totalTests = selectedTestsBasket.length; 
                const totalParameters = cumulativeParamsEach;

                const finalFormattedDate = normalizeToFullDate(customDate);

                if (editingRecordId) {
                    const updatedPayload = {
                        date: finalFormattedDate,
                        patientType,
                        age,
                        ageUnit: patientAgeUnit,
                        sex: patientSex,
                        testName: combinedTestNames,
                        basketItems: selectedTestsBasket.map(t => ({ name: t.name, parameters: t.parameters, type: t.type || 'Inhouse' })),
                        parametersPerTest: cumulativeParamsEach,
                        totalTests,
                        totalParameters,
                        notes: notes.trim() || 'N/A'
                    };

                    try {
                        const { data, error } = await supabase
                            .from('lab_entries')
                            .update(updatedPayload)
                            .eq('id', editingRecordId)
                            .select();

                        if (error) throw error;
                        setEntries(entries.map(item => item.id === editingRecordId ? data[0] : item));
                        cancelEditing();
                    } catch (err) {
                        alert("Error modifying record line: " + err.message);
                    }
                } else {
                    const newEntriesBatch = [];
                    const currentTimeString = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

                    for (let i = 0; i < count; i++) {
                        newEntriesBatch.push({
                            date: finalFormattedDate,
                            time: currentTimeString,
                            patientType,
                            age,
                            ageUnit: patientAgeUnit,
                            sex: patientSex,
                            testName: combinedTestNames,
                            basketItems: selectedTestsBasket.map(t => ({ name: t.name, parameters: t.parameters, type: t.type || 'Inhouse' })),
                            parametersPerTest: cumulativeParamsEach,
                            totalTests,
                            totalParameters,
                            notes: notes.trim() || 'N/A'
                        });
                    }

                    try {
                        const { data, error } = await supabase
                            .from('lab_entries')
                            .insert(newEntriesBatch)
                            .select();

                        if (error) throw error;
                        setEntries([...data, ...entries]);
                        setPatientAge('');
                        setPatientAgeUnit('Years');
                        setPatientCount('1');
                        setNotes('');
                        setSelectedTestsBasket([]);
                        setCustomDate(getTodayDDMMYY());
                    } catch (err) {
                        alert("Error saving record: " + err.message);
                    }
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    const text = event.target.result;
                    const lines = text.split('\n');
                    const parsedRecords = [];
                    const currentTimeString = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;
                        
                        const columns = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                        if (columns.length < 5) continue;

                        const rawFileDate = columns[0].replace(/"/g, '').trim() || new Date().toLocaleDateString('en-IN');
                        const fileDate = normalizeToFullDate(rawFileDate);
                        const fileDept = columns[1].replace(/"/g, '').trim() || 'OPD';
                        const fileAgeRaw = columns[2].replace(/"/g, '').trim() || '30 Years';
                        let fileAge = parseInt(fileAgeRaw) || 30;
                        let fileAgeUnit = 'Years';
                        if (fileAgeRaw.includes('Days')) fileAgeUnit = 'Days';
                        else if (fileAgeRaw.includes('Months')) fileAgeUnit = 'Months';

                        const fileSex = columns[3].replace(/"/g, '').trim() || 'Male';
                        const fileTestsString = columns[4].replace(/"/g, '').trim();
                        const fileNotes = columns[5] ? columns[5].replace(/"/g, '').trim() : 'Imported';

                        const testNames = fileTestsString.split('+').map(n => n.trim());
                        const resolvedBasket = testNames.map(name => {
                            const matched = testDirectory.find(t => t.name.toLowerCase() === name.toLowerCase());
                            return {
                                name: matched ? matched.name : name,
                                parameters: matched ? matched.parameters : 1,
                                type: matched ? matched.type : 'Inhouse'
                            };
                        });

                        const cumParams = resolvedBasket.reduce((sum, t) => sum + t.parameters, 0);

                        parsedRecords.push({
                            date: fileDate,
                            time: currentTimeString,
                            patientType: fileDept,
                            age: fileAge,
                            ageUnit: fileAgeUnit,
                            sex: fileSex,
                            testName: resolvedBasket.map(b => b.name).join(' + '),
                            basketItems: resolvedBasket,
                            parametersPerTest: cumParams,
                            totalTests: resolvedBasket.length,
                            totalParameters: cumParams,
                            notes: fileNotes
                        });
                    }

                    if (parsedRecords.length === 0) {
                        alert("Could not extract clean records from CSV.");
                        return;
                    }

                    try {
                        const { data, error } = await supabase
                            .from('lab_entries')
                            .insert(parsedRecords)
                            .select();

                        if (error) throw error;
                        setEntries([...data, ...entries]);
                        alert(`Successfully imported ${data.length} records!`);
                    } catch (err) {
                        alert("Error importing records: " + err.message);
                    }
                };
                reader.readAsText(file);
            };

            const deleteEntry = async (id) => {
                if (window.confirm("Are you sure you want to delete this specific record?")) {
                    try {
                        const { error } = await supabase.from('lab_entries').delete().eq('id', id);
                        if (error) throw error;
                        setEntries(entries.filter(entry => entry.id !== id));
                        if(editingRecordId === id) cancelEditing();
                    } catch (err) {
                        alert("Error removing record: " + err.message);
                    }
                }
            };

            const deleteTestFromDirectory = async (indexToDelete) => {
                if (testDirectory.length <= 1) {
                    alert("You must maintain at least 1 test profile in your directory.");
                    return;
                }
                const testObj = testDirectory[indexToDelete];
                if (window.confirm(`Delete "${testObj.name}" from your directory?`)) {
                    try {
                        const { error } = await supabase.from('test_directory').delete().eq('id', testObj.id);
                        if (error) throw error;
                        setTestDirectory(testDirectory.filter((_, idx) => idx !== indexToDelete));
                        setSelectedTestIndex('0');
                    } catch (err) {
                        alert("Error deleting test profile: " + err.message);
                    }
                }
            };

            const clearAllData = async () => {
                if (window.confirm("CRITICAL WARNING: This permanently clears all historically logged records! Proceed?")) {
                    try {
                        const { error } = await supabase.from('lab_entries').delete().neq('notes', 'SYSTEM_RESERVED_VAL_xyz_9999'); 
                        if (error) throw error;
                        setEntries([]);
                        cancelEditing();
                    } catch (err) {
                        alert("Error resetting database: " + err.message);
                    }
                }
            };

            const getAvailableMonths = () => {
                const monthsSet = new Set();
                monthsSet.add(getCurrentMonthString());
                
                entries.forEach(e => {
                    if (e.date && e.date.includes('/')) {
                        const [_, mm, yyyy] = e.date.split('/');
                        if (mm && yyyy && mm.length === 2 && yyyy.length === 4) {
                            monthsSet.add(`${yyyy}-${mm}`);
                        }
                    }
                });
                return Array.from(monthsSet).sort((a, b) => b.localeCompare(a));
            };

            const filteredEntries = entries.filter(entry => {
                if (!entry.date || !entry.date.includes('/')) return false;
                const [_, mm, yyyy] = entry.date.split('/');
                const entryMonthStr = `${yyyy}-${mm}`;
                return entryMonthStr === selectedMonth;
            });

            const metrics = filteredEntries.reduce((acc, curr) => {
                if (curr.patientType === 'OPD') {
                    acc.opdPatients += 1;
                    acc.opdParameters += curr.totalParameters;
                } else {
                    acc.ipdPatients += 1;
                    acc.ipdParameters += curr.totalParameters;
                }
                acc.totalPatients += 1;
                acc.totalParameters += curr.totalParameters;
                acc.totalTests += (curr.totalTests || 0);

                const items = curr.basketItems || curr.testName.split(' + ').map(name => {
                    const match = testDirectory.find(t => t.name === name.trim());
                    return { name: name.trim(), type: match ? match.type : 'Inhouse' };
                });

                items.forEach(item => {
                    if (item.name) {
                        acc.individualTestCounts[item.name] = (acc.individualTestCounts[item.name] || 0) + 1;
                        
                        const match = testDirectory.find(t => t.name.toLowerCase() === item.name.trim().toLowerCase());
                        const itemType = item.type || (match ? match.type : 'Inhouse');

                        if (itemType === 'Inhouse') {
                            acc.totalInhouseTests += 1;
                        } else {
                            acc.totalOuthouseTests += 1;
                        }
                    }
                });

                return acc;
            }, { 
                opdPatients: 0, ipdPatients: 0, totalPatients: 0, totalParameters: 0, totalTests: 0,
                opdParameters: 0, ipdParameters: 0, totalInhouseTests: 0, totalOuthouseTests: 0,
                individualTestCounts: {}
            });

            // Card Breakdown Inspector Modal
            const openCardBreakdown = (categoryFilter = 'ALL') => {
                const breakdownMap = {};

                filteredEntries.forEach(entry => {
                    const isOPD = entry.patientType === 'OPD';
                    const isIPD = entry.patientType === 'IPD';

                    const items = entry.basketItems || entry.testName.split(' + ').map(name => {
                        const match = testDirectory.find(t => t.name === name.trim());
                        return { 
                            name: name.trim(), 
                            parameters: match ? match.parameters : 1, 
                            type: match ? match.type : 'Inhouse' 
                        };
                    });

                    items.forEach(item => {
                        const tName = item.name.trim();
                        const matchDir = testDirectory.find(td => td.name.trim().toLowerCase() === tName.toLowerCase());
                        const perTestParams = (item.parameters && Number(item.parameters) > 0) ? Number(item.parameters) : (matchDir ? matchDir.parameters : 1);
                        const itemType = matchDir ? matchDir.type : (item.type || 'Inhouse');

                        let include = false;
                        if (categoryFilter === 'ALL' || categoryFilter === 'PATIENTS') {
                            include = true;
                        } else if (categoryFilter === 'OPD' && isOPD) {
                            include = true;
                        } else if (categoryFilter === 'IPD' && isIPD) {
                            include = true;
                        } else if (categoryFilter === 'INHOUSE' && itemType === 'Inhouse') {
                            include = true;
                        } else if (categoryFilter === 'OUTHOUSE' && itemType === 'Outhouse') {
                            include = true;
                        }

                        if (include) {
                            if (!breakdownMap[tName]) {
                                breakdownMap[tName] = {
                                    name: tName,
                                    perTestParams,
                                    type: itemType,
                                    opdTests: 0,
                                    opdParams: 0,
                                    ipdTests: 0,
                                    ipdParams: 0
                                };
                            }

                            if (isOPD) {
                                breakdownMap[tName].opdTests += 1;
                                breakdownMap[tName].opdParams += perTestParams;
                            } else if (isIPD) {
                                breakdownMap[tName].ipdTests += 1;
                                breakdownMap[tName].ipdParams += perTestParams;
                            }
                        }
                    });
                });

                const dataArray = Object.values(breakdownMap).sort((a, b) => (b.opdParams + b.ipdParams) - (a.opdParams + a.ipdParams));
                
                let title = "Tested Parameters & Volume Breakdown";
                let subtitle = `Detailed OPD vs IPD Metrics (${formatMonthDisplay(selectedMonth)})`;

                if (categoryFilter === 'OPD') {
                    title = "OPD Parameter & Test Breakdown";
                } else if (categoryFilter === 'IPD') {
                    title = "IPD Parameter & Test Breakdown";
                } else if (categoryFilter === 'INHOUSE') {
                    title = "Inhouse Tests Parameter Breakdown";
                } else if (categoryFilter === 'OUTHOUSE') {
                    title = "Outhouse Tests Parameter Breakdown";
                }

                setDetailModal({ show: true, title, subtitle, data: dataArray });
            };

            // Date-Wise Performed Tests Modal for Menu Distribution Items
            const openTestDateBreakdown = (testName) => {
                const dateMap = {};

                filteredEntries.forEach(entry => {
                    const entryDate = entry.date;
                    const isOPD = entry.patientType === 'OPD';
                    const isIPD = entry.patientType === 'IPD';

                    const items = entry.basketItems || entry.testName.split(' + ').map(name => ({ name: name.trim() }));

                    items.forEach(item => {
                        if (item.name.trim().toLowerCase() === testName.trim().toLowerCase()) {
                            const matchDir = testDirectory.find(td => td.name.trim().toLowerCase() === testName.trim().toLowerCase());
                            const perTestParams = matchDir ? matchDir.parameters : 1;

                            if (!dateMap[entryDate]) {
                                dateMap[entryDate] = {
                                    date: entryDate,
                                    opdCount: 0,
                                    ipdCount: 0,
                                    totalCount: 0,
                                    totalParams: 0
                                };
                            }

                            if (isOPD) dateMap[entryDate].opdCount += 1;
                            if (isIPD) dateMap[entryDate].ipdCount += 1;

                            dateMap[entryDate].totalCount += 1;
                            dateMap[entryDate].totalParams += perTestParams;
                        }
                    });
                });

                const dateWiseData = Object.values(dateMap).sort((a, b) => {
                    const [d1, m1, y1] = a.date.split('/').map(Number);
                    const [d2, m2, y2] = b.date.split('/').map(Number);
                    return new Date(y1, m1 - 1, d1) - new Date(y2, m2 - 1, d2);
                });

                setTestDateModal({ show: true, testName, dateWiseData });
            };

            const exportToCSV = () => {
                if (filteredEntries.length === 0) return alert("No metrics logged in this window to export.");

                // --- Demographic Calculation: Patients 60 Years and Above (Male & Female) ---
                const seniors = filteredEntries.filter(e => {
                    const ageNum = Number(e.age) || 0;
                    const unit = (e.ageUnit || 'Years').toLowerCase();
                    return unit === 'years' && ageNum >= 60;
                });

                const seniorStats = seniors.reduce((acc, curr) => {
                    const isOPD = curr.patientType === 'OPD';
                    const sex = (curr.sex || '').toLowerCase();

                    if (sex === 'male') {
                        if (isOPD) acc.opdMale += 1;
                        else acc.ipdMale += 1;
                        acc.totalMale += 1;
                    } else if (sex === 'female') {
                        if (isOPD) acc.opdFemale += 1;
                        else acc.ipdFemale += 1;
                        acc.totalFemale += 1;
                    }
                    return acc;
                }, { opdMale: 0, ipdMale: 0, totalMale: 0, opdFemale: 0, ipdFemale: 0, totalFemale: 0 });

                // --- Section 1: Matrix Data Assembly ---
                const uniqueDatesSet = new Set();
                filteredEntries.forEach(e => { if (e.date) uniqueDatesSet.add(e.date); });
                const sortedDates = Array.from(uniqueDatesSet).sort((a, b) => {
                    const [d1, m1, y1] = a.split('/').map(Number);
                    const [d2, m2, y2] = b.split('/').map(Number);
                    return new Date(y1, m1 - 1, d1) - new Date(y2, m2 - 1, d2);
                });

                const uniqueTestNamesSet = new Set();
                testDirectory.forEach(t => uniqueTestNamesSet.add(t.name.trim()));
                filteredEntries.forEach(e => {
                    const items = e.basketItems || e.testName.split(' + ').map(name => ({ name: name.trim() }));
                    items.forEach(item => { if (item.name) uniqueTestNamesSet.add(item.name.trim()); });
                });
                const allTestNames = Array.from(uniqueTestNamesSet).filter(Boolean);

                const matrixCount = {};
                allTestNames.forEach(tName => {
                    matrixCount[tName] = {};
                    sortedDates.forEach(dStr => {
                        const matchDir = testDirectory.find(td => td.name.trim() === tName);
                        matrixCount[tName][dStr] = {
                            testCount: 0,
                            paramWeight: matchDir ? matchDir.parameters : 0,
                            type: matchDir ? matchDir.type : 'Inhouse'
                        };
                    });
                });

                filteredEntries.forEach(e => {
                    const dStr = e.date;
                    const items = e.basketItems || e.testName.split(' + ').map(name => ({ name: name.trim(), parameters: 0 }));
                    items.forEach(item => {
                        const targetedName = item.name.trim();
                        if (matrixCount[targetedName] && matrixCount[targetedName][dStr] !== undefined) {
                            matrixCount[targetedName][dStr].testCount += 1;
                            if (item.parameters && Number(item.parameters) > 0) {
                                matrixCount[targetedName][dStr].paramWeight = Number(item.parameters);
                            }
                        }
                    });
                });

                const p1Headers = ["Test Profile Title", "Routing Type"];
                sortedDates.forEach(date => {
                    p1Headers.push(`"${date} (Volume)"`);
                    p1Headers.push(`"${date} (Parameters)"`);
                });
                p1Headers.push("Cumulative Volume", "Cumulative Parameters");

                const p1Rows = [];

                const inhouseTestNames = allTestNames.filter(tName => {
                    const sampleObj = matrixCount[tName][sortedDates[0]] || { type: 'Inhouse' };
                    return sampleObj.type === 'Inhouse';
                });

                const outhouseTestNames = allTestNames.filter(tName => {
                    const sampleObj = matrixCount[tName][sortedDates[0]] || { type: 'Inhouse' };
                    return sampleObj.type === 'Outhouse';
                });

                const inhouseColumnTotals = {};
                const outhouseColumnTotals = {};
                sortedDates.forEach(dStr => {
                    inhouseColumnTotals[dStr] = { tests: 0, params: 0 };
                    outhouseColumnTotals[dStr] = { tests: 0, params: 0 };
                });

                let ihGrandTotalTests = 0, ihGrandTotalParams = 0;
                let ohGrandTotalTests = 0, ohGrandTotalParams = 0;

                p1Rows.push("\"--- INHOUSE LAB TESTS ---\",\"\"");
                inhouseTestNames.forEach(tName => {
                    const sampleObj = matrixCount[tName][sortedDates[0]] || { type: 'Inhouse' };
                    const rowCells = [`"${tName.replace(/"/g, '""')}"`, `"${sampleObj.type}"`];
                    let rowTotalTests = 0;
                    let rowTotalParams = 0;

                    sortedDates.forEach(date => {
                        const count = matrixCount[tName][date].testCount || 0;
                        const weight = matrixCount[tName][date].paramWeight || 0;
                        const calculatedParams = count * weight;

                        rowCells.push(count);
                        rowCells.push(calculatedParams);

                        rowTotalTests += count;
                        rowTotalParams += calculatedParams;

                        inhouseColumnTotals[date].tests += count;
                        inhouseColumnTotals[date].params += calculatedParams;
                    });

                    rowCells.push(rowTotalTests);
                    rowCells.push(rowTotalParams);
                    ihGrandTotalTests += rowTotalTests;
                    ihGrandTotalParams += rowTotalParams;

                    p1Rows.push(rowCells.join(","));
                });

                const ihTotalRow = ["\"SUBTOTAL (INHOUSE COUNT)\"", "\"-\""];
                sortedDates.forEach(date => {
                    ihTotalRow.push(inhouseColumnTotals[date].tests);
                    ihTotalRow.push(inhouseColumnTotals[date].params);
                });
                ihTotalRow.push(ihGrandTotalTests);
                ihTotalRow.push(ihGrandTotalParams);
                p1Rows.push(ihTotalRow.join(","));

                p1Rows.push("\"\",\"\"");

                p1Rows.push("\"--- OUTHOUSE REFERRED TESTS ---\",\"\"");
                outhouseTestNames.forEach(tName => {
                    const sampleObj = matrixCount[tName][sortedDates[0]] || { type: 'Outhouse' };
                    const rowCells = [`"${tName.replace(/"/g, '""')}"`, `"${sampleObj.type}"`];
                    let rowTotalTests = 0;
                    let rowTotalParams = 0;

                    sortedDates.forEach(date => {
                        const count = matrixCount[tName][date].testCount || 0;
                        const weight = matrixCount[tName][date].paramWeight || 0;
                        const calculatedParams = count * weight;

                        rowCells.push(count);
                        rowCells.push(calculatedParams);

                        rowTotalTests += count;
                        rowTotalParams += calculatedParams;

                        outhouseColumnTotals[date].tests += count;
                        outhouseColumnTotals[date].params += calculatedParams;
                    });

                    rowCells.push(rowTotalTests);
                    rowCells.push(rowTotalParams);
                    ohGrandTotalTests += rowTotalTests;
                    ohGrandTotalParams += rowTotalParams;

                    p1Rows.push(rowCells.join(","));
                });

                const ohTotalRow = ["\"SUBTOTAL (OUTHOUSE COUNT)\"", "\"-\""];
                sortedDates.forEach(date => {
                    ohTotalRow.push(outhouseColumnTotals[date].tests);
                    ohTotalRow.push(outhouseColumnTotals[date].params);
                });
                ohTotalRow.push(ohGrandTotalTests);
                ohTotalRow.push(ohGrandTotalParams);
                p1Rows.push(ohTotalRow.join(","));

                p1Rows.push("\"\",\"\""); 

                const finalTotalRow = ["\"GRAND TOTAL COMBINED\"", "\"-\""];
                sortedDates.forEach(date => {
                    finalTotalRow.push(inhouseColumnTotals[date].tests + outhouseColumnTotals[date].tests);
                    finalTotalRow.push(inhouseColumnTotals[date].params + outhouseColumnTotals[date].params);
                });
                finalTotalRow.push(ihGrandTotalTests + ohGrandTotalTests);
                finalTotalRow.push(ihGrandTotalParams + ohGrandTotalParams);
                p1Rows.push(finalTotalRow.join(","));

                // --- Section 2: Senior Demographic Breakdown Table ---
                const demographicSection = 
                    "\n\n===================================================\n" +
                    `SECTION 2: SENIOR PATIENTS DEMOGRAPHICS (AGE 60 AND ABOVE) (${selectedMonth})\n` +
                    "===================================================\n" +
                    "Gender,OPD Count,IPD Count,Total Count\n" +
                    `Male,${seniorStats.opdMale},${seniorStats.ipdMale},${seniorStats.totalMale}\n` +
                    `Female,${seniorStats.opdFemale},${seniorStats.ipdFemale},${seniorStats.totalFemale}\n` +
                    `Total Senior Patients,${seniorStats.opdMale + seniorStats.opdFemale},${seniorStats.ipdMale + seniorStats.ipdFemale},${seniorStats.totalMale + seniorStats.totalFemale}`;

                const finalCsvString = 
                    "===================================================\n" +
                    `SECTION 1: SPREADSHEET MATRIX SUMMARY REPORT (${selectedMonth})\n` +
                    "===================================================\n" +
                    p1Headers.join(",") + "\n" + 
                    p1Rows.join("\n") +
                    demographicSection;

                const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), finalCsvString], { type: "text/csv;charset=utf-8;" });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `Lab_Summary_${selectedMonth}_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const formatMonthDisplay = (monthStr) => {
                const [year, month] = monthStr.split('-');
                const date = new Date(year, parseInt(month) - 1, 1);
                return date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            };

            return (
                <div className="min-h-screen p-4 md:p-6 text-slate-800 max-w-7xl mx-auto">
                    {/* Header Banner */}
                    <header className="mb-6 flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-200 pb-4 gap-4">
                        <div>
                            <h1 className="text-2xl md:text-3xl font-black text-teal-800 tracking-tight">Lab Statistics Tracker Terminal</h1>
                            <p className="text-xs text-slate-500 mt-0.5 font-medium">Real-time sync cloud pipeline connected via Supabase engine.</p>
                        </div>
                        <div className="flex flex-wrap items-center gap-2 w-full md:w-auto">
                            {/* Monthly View Window Selector */}
                            <div className="flex items-center bg-teal-50 border border-teal-200 rounded-lg px-2.5 py-1.5 shrink-0">
                                <label className="text-[10px] font-black text-teal-800 uppercase tracking-wider mr-2">View Window:</label>
                                <select 
                                    value={selectedMonth} 
                                    onChange={(e) => setSelectedMonth(e.target.value)}
                                    className="bg-transparent text-xs font-bold text-teal-900 focus:outline-none cursor-pointer"
                                >
                                    {getAvailableMonths().map((mStr) => (
                                        <option key={mStr} value={mStr}>{formatMonthDisplay(mStr)} {mStr === getCurrentMonthString() ? '(Current)' : ''}</option>
                                    ))}
                                </select>
                            </div>
                            <button onClick={() => setShowTestModal(true)} className="bg-slate-600 hover:bg-slate-700 text-white px-3 py-2 rounded-lg text-xs font-bold transition shadow-sm">
                                ⚙️ Setup Test Library
                            </button>
                            <button onClick={exportToCSV} className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-xs font-bold transition shadow-sm">
                                📥 Download (.CSV)
                            </button>
                            <button onClick={clearAllData} className="bg-rose-600 hover:bg-rose-700 text-white px-3 py-2 rounded-lg text-xs font-bold transition shadow-sm">
                                ⚠️️ Reset Records
                            </button>
                        </div>
                    </header>

                    {/* Drag/Drop CSV Import Block */}
                    <div className="mb-6 p-4 bg-white rounded-xl border-2 border-dashed border-slate-300 hover:border-teal-500 transition relative flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm">
                        <div className="flex items-center gap-3">
                            <span className="text-2xl">📄</span>
                            <div>
                                <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wide">Import CSV Data Sheet</h4>
                                <p className="text-[11px] text-slate-400 font-medium">Upload a standard comma-separated text `.csv` format log sheet matching row structures.</p>
                            </div>
                        </div>
                        <input 
                            type="file" 
                            accept=".csv,.txt" 
                            onChange={handleFileUpload}
                            className="text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-bold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 cursor-pointer"
                        />
                    </div>

                    {/* Active Window Title */}
                    <div className="mb-3 px-1 flex justify-between items-center">
                        <h3 className="text-xs font-black text-slate-500 uppercase tracking-wider">
                            📊 Snapshot Metrics Window: <span className="text-teal-700 font-extrabold">{formatMonthDisplay(selectedMonth)}</span>
                            <span className="text-[10px] text-slate-400 font-normal ml-2">(Click cards for parameter breakdown)</span>
                        </h3>
                        <span className="text-[10px] bg-slate-200 text-slate-700 font-bold px-2 py-0.5 rounded-sm">
                            Showing {filteredEntries.length} of {entries.length} items
                        </span>
                    </div>

                    {/* Interactive Scorecard Cards */}
                    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-6">
                        <div onClick={() => openCardBreakdown('ALL')} className="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 border-t-4 border-t-slate-700 cursor-pointer hover:shadow-md transition hover:scale-[1.01]">
                            <div className="flex justify-between items-start">
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total Patients</p>
                                <span className="text-[10px]">🔍</span>
                            </div>
                            <p className="text-xl font-black text-slate-800 mt-0.5">{metrics.totalPatients}</p>
                        </div>
                        <div onClick={() => openCardBreakdown('OPD')} className="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-teal-600 cursor-pointer hover:shadow-md transition hover:scale-[1.01]">
                            <div className="flex justify-between items-start">
                                <p className="text-[10px] font-bold text-teal-600 uppercase tracking-wider">OPD Patients</p>
                                <span className="text-[10px]">🔍</span>
                            </div>
                            <p className="text-xl font-black text-teal-700 mt-0.5">{metrics.opdPatients}</p>
                        </div>
                        <div onClick={() => openCardBreakdown('IPD')} className="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-indigo-600 cursor-pointer hover:shadow-md transition hover:scale-[1.01]">
                            <div className="flex justify-between items-start">
                                <p className="text-[10px] font-bold text-indigo-600 uppercase tracking-wider">IPD Patients</p>
                                <span className="text-[10px]">🔍</span>
                            </div>
                            <p className="text-xl font-black text-indigo-700 mt-0.5">{metrics.ipdPatients}</p>
                        </div>
                        <div onClick={() => openCardBreakdown('ALL')} className="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 border-t-4 border-t-cyan-600 cursor-pointer hover:shadow-md transition hover:scale-[1.01]">
                            <div className="flex justify-between items-start">
                                <p className="text-[10px] font-bold text-cyan-600 uppercase tracking-wider">Total Tests Vol</p>
                                <span className="text-[10px]">🔍</span>
                            </div>
                            <p className="text-xl font-black text-cyan-700 mt-0.5">{metrics.totalTests}</p>
                        </div>
                        <div onClick={() => openCardBreakdown('ALL')} className="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-purple-600 cursor-pointer hover:shadow-md transition hover:scale-[1.01]">
                            <div className="flex justify-between items-start">
                                <p className="text-[10px] font-bold text-purple-600 uppercase tracking-wider">Total Parameters</p>
                                <span className="text-[10px]">🔍</span>
                            </div>
                            <p className="text-xl font-black text-purple-700 mt-0.5">{metrics.totalParameters}</p>
                        </div>
                        <div onClick={() => openCardBreakdown('OPD')} className="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 border-b-4 border-b-teal-500 cursor-pointer hover:shadow-md transition hover:scale-[1.01]">
                            <div className="flex justify-between items-start">
                                <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">OPD Parameters</p>
                                <span className="text-[10px]">🔍</span>
                            </div>
                            <p className="text-xl font-black text-teal-600 mt-0.5">{metrics.opdParameters}</p>
                        </div>
                        <div onClick={() => openCardBreakdown('IPD')} className="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 border-b-4 border-b-indigo-500 cursor-pointer hover:shadow-md transition hover:scale-[1.01]">
                            <div className="flex justify-between items-start">
                                <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">IPD Parameters</p>
                                <span className="text-[10px]">🔍</span>
                            </div>
                            <p className="text-xl font-black text-indigo-600 mt-0.5">{metrics.ipdParameters}</p>
                        </div>
                        <div onClick={() => openCardBreakdown('INHOUSE')} className="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-emerald-600 cursor-pointer hover:shadow-md transition hover:scale-[1.01]">
                            <div className="flex justify-between items-start">
                                <p className="text-[10px] font-bold text-emerald-600 uppercase tracking-wider">Inhouse Processed</p>
                                <span className="text-[10px]">🔍</span>
                            </div>
                            <p className="text-xl font-black text-emerald-700 mt-0.5">{metrics.totalInhouseTests}</p>
                        </div>
                        <div onClick={() => openCardBreakdown('OUTHOUSE')} className="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-amber-500 cursor-pointer hover:shadow-md transition hover:scale-[1.01]">
                            <div className="flex justify-between items-start">
                                <p className="text-[10px] font-bold text-amber-600 uppercase tracking-wider">Outhouse Referred</p>
                                <span className="text-[10px]">🔍</span>
                            </div>
                            <p className="text-xl font-black text-amber-700 mt-0.5">{metrics.totalOuthouseTests}</p>
                        </div>
                    </div>

                    {/* Menu Distribution Catalog Diagnostics */}
                    <div className="bg-slate-100 border border-slate-200 rounded-xl p-4 mb-6">
                        <div className="flex justify-between items-center mb-2.5">
                            <p className="text-xs font-bold text-slate-600 uppercase tracking-wider">📊 Menu Distribution Catalog Diagnostics ({formatMonthDisplay(selectedMonth)})</p>
                            <span className="text-[10px] text-slate-400 font-medium">Click a test item to view date-wise logs</span>
                        </div>
                        {testDirectory.length === 0 ? (
                            <p className="text-xs text-slate-400 italic">No directory profiles mapped yet.</p>
                        ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-2.5">
                                {testDirectory.map((test, index) => {
                                    const currentCount = metrics.individualTestCounts[test.name] || 0;
                                    return (
                                        <div 
                                            key={index} 
                                            onClick={() => openTestDateBreakdown(test.name)}
                                            className="bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm flex flex-col justify-between cursor-pointer hover:border-teal-500 hover:ring-2 hover:ring-teal-500/10 transition"
                                        >
                                            <div className="flex justify-between items-start gap-1">
                                                <span className="text-xs font-bold text-slate-700 truncate block" title={test.name}>{test.name}</span>
                                                <span className={`text-[8px] px-1 py-0.2 rounded font-black tracking-tight shrink-0 ${test.type === 'Outhouse' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>{test.type === 'Outhouse' ? 'OH' : 'IH'}</span>
                                            </div>
                                            <div className="flex justify-between items-baseline mt-2 pt-1 border-t border-slate-50">
                                                <span className="text-md font-black text-teal-700">{currentCount} <span className="text-[10px] font-normal text-slate-400">tests</span></span>
                                                <span className="text-[9px] font-bold text-slate-400">📅 View Dates</span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Entry Form */}
                        <div className={`p-5 rounded-xl shadow-sm border h-fit transition-all ${editingRecordId ? 'bg-amber-50/70 border-amber-300 ring-2 ring-amber-400/20' : 'bg-white border-slate-200'}`}>
                            <div className="flex justify-between items-center mb-4 border-b pb-2">
                                <h2 className="text-lg font-black text-slate-700">{editingRecordId ? '📝 Edit Patient Record Line' : 'Patient Lab Entry Terminal'}</h2>
                                {editingRecordId && (
                                    <button onClick={cancelEditing} className="text-xs font-bold text-amber-700 hover:underline bg-amber-100 px-2 py-0.5 rounded">
                                        Cancel Edit
                                    </button>
                                )}
                            </div>
                            
                            <form onSubmit={handleSubmitEntry} className="space-y-4">
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 tracking-wider">Department Routing</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button
                                            type="button"
                                            onClick={() => setPatientType('OPD')}
                                            className={`py-2 text-center rounded-lg font-bold transition text-xs ${patientType === 'OPD' ? 'bg-teal-50 text-teal-700 border-2 border-teal-600' : 'bg-slate-100 text-slate-600 border border-transparent hover:bg-slate-200'}`}
                                        >
                                            OPD (Outpatient)
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setPatientType('IPD')}
                                            className={`py-2 text-center rounded-lg font-bold transition text-xs ${patientType === 'IPD' ? 'bg-indigo-50 text-indigo-700 border-2 border-indigo-600' : 'bg-slate-100 text-slate-600 border border-transparent hover:bg-slate-200'}`}
                                        >
                                            IPD (Inpatient)
                                        </button>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-600 mb-1">Logging Entry Date (dd/mm/yy)</label>
                                    <input
                                        type="text"
                                        placeholder="dd/mm/yy"
                                        maxLength="8"
                                        value={customDate}
                                        onChange={(e) => handleCustomDateChange(e.target.value)}
                                        className="w-full p-2 border border-slate-300 rounded-lg text-xs bg-white font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-500"
                                    />
                                </div>

                                <div className="grid grid-cols-12 gap-2">
                                    <div className="col-span-3">
                                        <label className="block text-xs font-bold text-slate-600 mb-1">Age</label>
                                        <input
                                            type="number"
                                            min="1"
                                            placeholder="35"
                                            value={patientAge}
                                            onChange={(e) => setPatientAge(e.target.value)}
                                            className="w-full p-2 border border-slate-300 rounded-lg text-xs font-semibold"
                                            required
                                        />
                                    </div>
                                    <div className="col-span-3">
                                        <label className="block text-xs font-bold text-slate-600 mb-1">Unit</label>
                                        <select
                                            value={patientAgeUnit}
                                            onChange={(e) => setPatientAgeUnit(e.target.value)}
                                            className="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs font-semibold"
                                        >
                                            <option value="Days">Days</option>
                                            <option value="Months">Months</option>
                                            <option value="Years">Years</option>
                                        </select>
                                    </div>
                                    <div className="col-span-3">
                                        <label className="block text-xs font-bold text-slate-600 mb-1">Sex</label>
                                        <select
                                            value={patientSex}
                                            onChange={(e) => setPatientSex(e.target.value)}
                                            className="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs font-semibold"
                                        >
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                    <div className="col-span-3">
                                        <label className="block text-xs font-bold text-slate-600 mb-1">Batch</label>
                                        <input
                                            type="number"
                                            min="1"
                                            disabled={!!editingRecordId}
                                            value={patientCount}
                                            onChange={(e) => setPatientCount(e.target.value)}
                                            className="w-full p-2 border border-slate-300 rounded-lg text-xs font-black bg-slate-50 text-teal-700 disabled:opacity-50"
                                            required
                                        />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-600 mb-1">Select Diagnostic Profile Item</label>
                                    <div className="flex gap-1.5">
                                        <select
                                            value={selectedTestIndex}
                                            onChange={(e) => setSelectedTestIndex(e.target.value)}
                                            className="flex-1 p-2 border border-slate-300 rounded-lg bg-white text-xs font-semibold"
                                        >
                                            {testDirectory.map((test, index) => (
                                                <option key={index} value={index}>
                                                    {test.name} [{test.type === 'Outhouse' ? 'OH' : 'IH'}]
                                                </option>
                                            ))}
                                        </select>
                                        <button
                                            type="button"
                                            onClick={addTestToBasket}
                                            className="bg-teal-600 hover:bg-teal-700 text-white font-bold px-3 rounded-lg text-xs whitespace-nowrap"
                                        >
                                            + Add
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-slate-50 p-3 rounded-lg border border-slate-200">
                                    <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Active Bundle Basket</label>
                                    {selectedTestsBasket.length === 0 ? (
                                        <p className="text-xs text-slate-400 italic font-medium">Bundle is blank. Hook profiles from selector.</p>
                                    ) : (
                                        <div className="flex flex-wrap gap-1">
                                            {selectedTestsBasket.map((test, idx) => (
                                                <span key={idx} className={`inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded border ${test.type === 'Outhouse' ? 'bg-amber-50 text-amber-800 border-amber-200' : 'bg-teal-50 text-teal-800 border-teal-200'}`}>
                                                    {test.name}
                                                    <button type="button" onClick={() => removeTestFromBasket(idx)} className="text-slate-400 hover:text-slate-900 font-bold ml-1 text-xs">
                                                        &times;
                                                    </button>
                                                </span>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-600 mb-1">Remarks / Operational Logs</label>
                                    <input
                                        type="text"
                                        placeholder="Add operational notes here..."
                                        value={notes}
                                        onChange={(e) => setNotes(e.target.value)}
                                        className="w-full p-2 border border-slate-300 rounded-lg text-xs font-medium"
                                    />
                                </div>

                                <button
                                    type="submit"
                                    className={`w-full text-white font-bold py-2 px-4 rounded-lg transition text-xs shadow-md mt-2 ${editingRecordId ? 'bg-amber-600 hover:bg-amber-700' : 'bg-teal-700 hover:bg-teal-800'}`}
                                >
                                    {editingRecordId ? 'Apply & Save System Changes' : `Commit Entry Row Line${parseInt(patientCount) > 1 ? `s (${patientCount}x)` : ''}`}
                                </button>
                            </form>
                        </div>

                        {/* Audit Logs Table Workspace */}
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 lg:col-span-2 flex flex-col overflow-hidden">
                            <h2 className="text-lg font-black text-slate-700 mb-4 border-b pb-2">Active Database Session Logs ({formatMonthDisplay(selectedMonth)})</h2>
                            
                            <div className="overflow-x-auto flex-1">
                                {filteredEntries.length === 0 ? (
                                    <div className="text-center py-20 text-slate-400 text-xs font-medium">
                                        No records logged inside the current monthly view window selection.
                                    </div>
                                ) : (
                                    <table className="w-full text-left border-collapse text-xs">
                                        <thead>
                                            <tr className="bg-slate-50 border-b border-slate-200 text-slate-400 uppercase tracking-wider text-[9px] font-black">
                                                <th className="p-2">Timestamp / Notes</th>
                                                <th className="p-2">Dept</th>
                                                <th className="p-2">Patient</th>
                                                <th className="p-2">Selected Basket Bundles</th>
                                                <th className="p-2 text-right">Params</th>
                                                <th className="p-2 text-center">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 font-medium text-slate-700">
                                            {filteredEntries.map((entry) => (
                                                <tr key={entry.id} className={`hover:bg-slate-50/80 transition ${editingRecordId === entry.id ? 'bg-amber-50/50' : ''}`}>
                                                    <td className="p-2">
                                                        <span className="font-bold text-slate-800 block">{entry.date}</span>
                                                        <span className="text-[10px] text-slate-400 block truncate max-w-[130px]">{entry.time} • {entry.notes}</span>
                                                    </td>
                                                    <td className="p-2">
                                                        <span className={`px-1.5 py-0.2 rounded text-[9px] font-black ${entry.patientType === 'OPD' ? 'bg-teal-50 text-teal-700' : 'bg-indigo-50 text-indigo-700'}`}>
                                                            {entry.patientType}
                                                        </span>
                                                    </td>
                                                    <td className="p-2">
                                                        <span className="font-bold block">{entry.age} {entry.ageUnit || 'Yrs'}</span>
                                                        <span className="text-[10px] text-slate-400 block">{entry.sex}</span>
                                                    </td>
                                                    <td className="p-2">
                                                        <div className="max-w-[170px] truncate font-semibold text-slate-800" title={entry.testName}>
                                                            {entry.basketItems ? entry.basketItems.map((b, i) => (
                                                                <span key={i} className={`inline-block text-[9px] px-1 mr-0.5 rounded ${b.type === 'Outhouse' ? 'bg-amber-100 text-amber-900' : 'bg-slate-100 text-slate-800'}`}>
                                                                    {b.name}
                                                                </span>
                                                            )) : entry.testName}
                                                        </div>
                                                        <span className="text-[9px] text-slate-400 block mt-0.5">x{entry.totalTests || 1} logs tracking</span>
                                                    </td>
                                                    <td className="p-2 text-right font-mono font-bold text-purple-700 text-xs">{entry.totalParameters}</td>
                                                    <td className="p-2 text-center space-x-2 whitespace-nowrap">
                                                        <button onClick={() => startEditing(entry)} className="text-[11px] font-bold text-teal-600 hover:text-teal-900 transition">
                                                            Modify
                                                        </button>
                                                        <button onClick={() => deleteEntry(entry.id)} className="text-[11px] font-bold text-rose-500 hover:text-rose-800 transition">
                                                            Drop
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Date-Wise Test Performance Breakdown Modal */}
                    {testDateModal.show && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-xl overflow-hidden max-h-[85vh] flex flex-col border border-slate-200">
                                <header className="bg-teal-800 text-white p-4 border-b border-teal-700 flex justify-between items-center">
                                    <div>
                                        <h3 className="text-sm font-black uppercase tracking-wide">Date-Wise Test Activity</h3>
                                        <p className="text-[11px] text-teal-200 font-medium">{testDateModal.testName} ({formatMonthDisplay(selectedMonth)})</p>
                                    </div>
                                    <button onClick={() => setTestDateModal({ ...testDateModal, show: false })} className="text-teal-200 hover:text-white font-bold text-2xl leading-none">&times;</button>
                                </header>
                                
                                <div className="p-4 overflow-y-auto flex-1">
                                    {testDateModal.dateWiseData.length === 0 ? (
                                        <p className="text-center text-xs text-slate-400 py-8">No tests performed for <strong>{testDateModal.testName}</strong> during {formatMonthDisplay(selectedMonth)}.</p>
                                    ) : (
                                        <table className="w-full text-left text-xs border-collapse">
                                            <thead>
                                                <tr className="bg-slate-100 text-slate-600 uppercase text-[9px] font-black tracking-wider border-b border-slate-200">
                                                    <th className="p-2.5">Date</th>
                                                    <th className="p-2.5 text-center bg-teal-50/50 text-teal-800">OPD Count</th>
                                                    <th className="p-2.5 text-center bg-indigo-50/50 text-indigo-800">IPD Count</th>
                                                    <th className="p-2.5 text-center">Total Tests</th>
                                                    <th className="p-2.5 text-right">Total Parameters</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 font-medium">
                                                {testDateModal.dateWiseData.map((row, idx) => (
                                                    <tr key={idx} className="hover:bg-slate-50">
                                                        <td className="p-2.5 font-bold text-slate-800">{row.date}</td>
                                                        <td className="p-2.5 text-center bg-teal-50/20 text-teal-700 font-bold">{row.opdCount}</td>
                                                        <td className="p-2.5 text-center bg-indigo-50/20 text-indigo-700 font-bold">{row.ipdCount}</td>
                                                        <td className="p-2.5 text-center font-bold text-slate-800">{row.totalCount}</td>
                                                        <td className="p-2.5 text-right font-mono font-black text-purple-700">{row.totalParams}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                            <tfoot>
                                                <tr className="bg-slate-100 text-slate-800 font-black text-xs border-t-2 border-slate-300">
                                                    <td className="p-2.5">Total Cumulative</td>
                                                    <td className="p-2.5 text-center text-teal-800">{testDateModal.dateWiseData.reduce((s, r) => s + r.opdCount, 0)}</td>
                                                    <td className="p-2.5 text-center text-indigo-800">{testDateModal.dateWiseData.reduce((s, r) => s + r.ipdCount, 0)}</td>
                                                    <td className="p-2.5 text-center text-slate-900">{testDateModal.dateWiseData.reduce((s, r) => s + r.totalCount, 0)}</td>
                                                    <td className="p-2.5 text-right font-mono text-purple-800">{testDateModal.dateWiseData.reduce((s, r) => s + r.totalParams, 0)}</td>
                                                </tr>
                                            </tfoot>
                                        </table>
                                    )}
